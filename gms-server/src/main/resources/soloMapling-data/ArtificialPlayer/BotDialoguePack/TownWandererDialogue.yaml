# 通用 TownWandererBot（城镇闲逛机器人）的共享环境对话（除射手村外的每个城镇都在用，射手村
# 保留其精心打磨的 HenesysBot 台词）。台词使用 {MAP} 上下文占位符，因此同一个文件在
# 废都、魔法密林、勇士部落、迷宫、天空之城、玩具城、雪域都能正确显示。台词保持与具体城镇无关——
# 不要加入射手村专属的内容。各城镇特色文件可稍后通过对话批量剧本添加。
TownWandererBot:
  CongratsLevelUp:
    text:
      - "恭喜 {PLAYER_NAME}！"
      - "不错哦，{PLAYER_LEVEL} 级了"
      - "恭喜恭喜"
      - "哎哟恭喜 {PLAYER_NAME}"
      - "已经 {PLAYER_LEVEL} 级了？厉害"
      - "继续肝 {PLAYER_NAME}"
      - "干得漂亮"
      - "恭喜升级"
      - "好样的 {PLAYER_NAME}"
      - "哦升级了，恭喜 {PLAYER_NAME}"
      - "冲冲冲 {PLAYER_NAME}"
      - "{PLAYER_LEVEL} 级，还不错嘛"
      - "恭喜 {PLAYER_NAME}，继续保持"
      - "一路升到 {PLAYER_LEVEL}，牛啊"
  PlayerReaction:
    text:
      - "哦嗨"
      - "咋了"
      - "你好呀"
      - "哟"
      - "路过而已"
      - "借过一下"
      - "之前在 {MAP} 没见过你啊"
      - "等等，我认识你吗？"
      - "嘿看着点路哈哈"
      - "{MAP} 今天天气不错哈"
      - "你是新来的吗？"
      - "嗯？"
      - "哦又是你啊哈哈"
      - "在忙啥呢"
      - "欢迎回来"
      - "今天 {MAP} 挺安静的"
      - "在外面小心点"
      - "有空一起组队吗？"
      - "*挥手*"
      - "好久不见"
  WanderChat:
    text:
      - "诶我刚才是要去哪来着"
      - "嗯走哪边好呢"
      - "随便走走活动下筋骨"
      - "{MAP} 其实还挺不错的"
      - "啦啦啦~"
      - "不知道今天有什么打折的"
      - "最近 {MAP} 人好多啊"
      - "我真该回去练级了"
      - "*打哈欠*"
      - "这儿挺清净的"
      - "超喜欢 {MAP} 这块地方"
      - "人都跑哪去了"
      - "再绕 {MAP} 逛一圈"
      - "这小镇永远都是老样子"
      - "我的枫币还不够花……"
      - "不知道商店补货了没"
      - "嗯"
      - "打发时间而已"
  EmoteReaction:
    text:
      - "哈哈"
      - "笑死"
      - "不错"
      - "哦？"
      - "嗯！"
      - "嘿嘿"
      - "好嘛"
      - "有点意思"
      - "不会吧"
      - ":)"
  MapTransition:
    text:
      - "我去别处逛一会儿"
      - "出去转转，回见"
      - "去别的地方看看，马上回来"
      - "我想往那边走了"
      - "{MAP} 回头见"
      - "该动身了"
      - "回头见"
      - "去别的地方伸伸腿"
      - "换个新地方也不错"
      - "溜了溜了~"
