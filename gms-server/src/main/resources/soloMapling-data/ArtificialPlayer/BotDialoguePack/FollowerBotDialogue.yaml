# FollowerBot 对话 —— 被招募后尾随队长的随从。仅在旁观时才会说话。
# 带有真实玩家上下文的节点可使用 {PLAYER_NAME}；LeaderLost/PartyFarewell 触发时没有玩家
# （队长直接消失了），所以这些节点保持无占位符 —— 一条找不到玩家来解析的占位符台词
# 会被引擎丢弃。

FollowerBot:

  FollowStart:
    text:
      - {line: "紧跟在你后面 {PLAYER_NAME}！", emote: 2}
      - "你带路，我跟得上"
      - {line: "好的 {PLAYER_NAME}，咱们去哪？", emote: 2}
      - "组队时间到，我跟定你了"
      - {line: "别走太快哈，腿短跟不上", emote: 6}
      - "走走走 ^^"
      - {line: "我粘定你了 {PLAYER_NAME}，别把我弄丢了", emote: 2}
      - "跟上啦！总比在城里干站着强多了"
      - "哦哦，冒险时间到"
      - {line: "你选地图，我负责活跃气氛", emote: 3}
    emote:
      - 2
      - 0
    wait: 1

  FreelanceStart:
    text:
      - "自由人模式启动，我自己先练着"
      - {line: "收到 {PLAYER_NAME}，我先自己刷一会儿", emote: 2}
      - "行，那我就单飞啦，有队了再喊我"
      - {line: "好嘞，我先就近清清怪 ^^", emote: 3}
      - "自由行动开始，怪物们颤抖吧"
      - {line: "明白，我自己也能玩得转 {PLAYER_NAME}", emote: 2}
    emote:
      - 2
      - 3
    wait: 1

  Rally:
    text:
      - {line: "来啦来啦！这就到 {PLAYER_NAME} 那里集合", emote: 2}
      - "收到集合信号，马上赶过去"
      - {line: "等我！腿短但我心急 ^^", emote: 3}
      - "别开打啊，我马上就到"
      - {line: "正在赶来，怪留点给我 {PLAYER_NAME}！", emote: 2}
      - "集合点收到，出发"
    emote:
      - 2
      - 3
    wait: 1

  StationHere:
    text:
      - {line: "这张图？看着不错 {PLAYER_NAME}，我就待这儿了", emote: 2}
      - "好嘞！刷怪时间到，这块我守住了"
      - {line: "选得好 {PLAYER_NAME}，到处都是怪，开刷吧", emote: 2}
      - "行，我打卡上班了，经验搞起来"
      - {line: "那就在这儿安顿了，抢怪别介意哈", emote: 3}
      - "位置不错。药水备好。开肝 ^^"
      - {line: "这儿吗？完美，反正我也走累了", emote: 2}
      - "成交，我负责清怪，你爱打哪边打哪边"
    emote:
      - 2
      - 3
    wait: 1

  LeaderLost:
    text:
      - "呃……喂？人呢"
      - {line: "等等- 我刚是不是把人跟丢了？？", emote: 6}
      - "嗯？他明明刚刚还在的"
      - "那我就先在这儿等等吧……"
      - {line: "完蛋，走散了。经典的我。", emote: 7}
      - "可能他去换频或者干啥去了吧"
      - "喂——？有人在吗？"
      - {line: "别慌别慌，他会回来的……对吧？", emote: 6}
    emote:
      - 6
      - 0
    wait: 1

  PartyFarewell:
    text:
      - "看来队伍散了，不过还挺开心的"
      - {line: "唉，又要一个人单刷了", emote: 4}
      - "好嘞！大家打得漂亮，回见"
      - "得，回去继续我自己的肝活吧"
      - {line: "队伍解散了啊……好歹曾经美好过", emote: 4}
      - "在外面加油！我自己也能行 ^^"
      - "没队伍也没问题，我还有怪要打呢"
      - {line: "就这样我又成了自由人", emote: 0}
    emote:
      - 4
      - 0
    wait: 1

  LoyalToLeader:
    text:
      - "抱歉，我已经有队伍了"
      - {line: "不行啊，我是 {PLAYER_NAME}……不对，我是别人队伍的哈哈", emote: 7}
      - "名花有主了！队规不能破"
      - {line: "问我队长吧，我只听命令行事 ^^", emote: 2}
      - "忠于队伍，抱歉啦"
      - "不能扔下我的队友不管"
    emote:
      - 0
      - 2
    wait: 1

  NoMobsHere:
    text:
      - "在这儿练级？连个能打的都没有啊"
      - {line: "呃……{PLAYER_NAME} 我一只怪都没看见", emote: 6}
      - "我也想啊，但是怪物们表示拒绝（压根没有怪）"
      - "先带我们去找张真有怪物的图吧 ^^"
      - {line: "那我砍啥？空气吗？", emote: 3}
      - "没怪就没得刷，带路吧"
    emote:
      - 6
      - 3
    wait: 1

  Goodbye:
    text:
      - "好嘞！我继续跟着"
      - {line: "回见，反正我就在你屁股后面哈哈", emote: 2}
      - "没问题，带路吧"
      - "好，出发 ^^"
      - {line: "好的 {PLAYER_NAME}，找到位置了喊我一声", emote: 2}
      - "收到，继续跟着走"
    emote:
      - 2
      - 0
    wait: 1

  PartyJoined:
    text:
      - "队伍申请通过！现在我们正式组上了 ^^"
      - {line: "加入你的队伍了 {PLAYER_NAME}，经验走起", emote: 2}
      - "进了！现在带我去个好地方吧"
      - {line: "正式和 {PLAYER_NAME} 组上队了，出发", emote: 2}
      - "通过了，我们现在是真队伍了嘿嘿"
      - "队伍到手！带路吧"
    emote:
      - 2
    wait: 1
