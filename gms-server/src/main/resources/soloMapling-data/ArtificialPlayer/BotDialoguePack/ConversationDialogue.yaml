conversations:

  # ═══════════════════════════════════════
  #  2-PERSON CONVERSATIONS
  # ═══════════════════════════════════════

  training_spot_debate:
    participants: 2
    lines:
      - {speaker: A, text: "你都在哪练级啊？"}
      - {speaker: B, text: "基本都在猪的海岸"}
      - {speaker: A, text: "那不是有点慢吗？", emote: 5}
      - {speaker: B, text: "是慢，但是很惬意，没人来烦我"}
      - {speaker: A, text: "行吧哈哈"}

  training_spot_debate_2:
    participants: 2
    lines:
      - {speaker: A, text: "我45级该去哪练级？"}
      - {speaker: B, text: "音乐村MP3或者蝴蝶鱼"}
      - {speaker: A, text: "哪个更快"}
      - {speaker: B, text: "有宠物就去蝴蝶鱼，没有就MP3"}
      - {speaker: A, text: "好嘞谢啦！", emote: 2}

  class_debate:
    participants: 2
    lines:
      - {speaker: A, text: "这游戏最强的职业是啥"}
      - {speaker: B, text: "那必须是标飞啊", emote: 3}
      - {speaker: A, text: "哈哈想啥呢，主教好用多了"}
      - {speaker: B, text: "好用是好用，但标飞伤害最高"}
      - {speaker: A, text: "随你便吧老哥", emote: 1}
      - {speaker: B, text: "气死你哈哈", emote: 3}

  class_debate_2:
    participants: 2
    lines:
      - {speaker: A, text: "我该练战士还是法师"}
      - {speaker: B, text: "看你想怎么玩。战士抗揍，法师群攻猛"}
      - {speaker: A, text: "我想耍帅"}
      - {speaker: B, text: "那就练个黑骑哈哈", emote: 2}
      - {speaker: A, text: "成交"}

  item_price_haggle:
    participants: 2
    lines:
      - {speaker: A, text: "那副艾比多少钱？"}
      - {speaker: B, text: "一套450万枫币"}
      - {speaker: A, text: "有点贵啊……350万怎么样？"}
      - {speaker: B, text: "不行，最低400万"}
      - {speaker: A, text: "成交", emote: 2}
      - {speaker: B, text: "交易吧"}

  item_price_haggle_2:
    participants: 2
    lines:
      - {speaker: A, text: "出售 10%手套攻击卷"}
      - {speaker: B, text: "多少钱"}
      - {speaker: A, text: "6000万"}
      - {speaker: B, text: "哈哈不用了谢了", emote: 4}
      - {speaker: A, text: "行，5000万最后价"}
      - {speaker: B, text: "不要了，祝你好卖"}

  quest_help:
    participants: 2
    lines:
      - {speaker: A, text: "你知道蘑菇神社在哪吗？"}
      - {speaker: B, text: "知道，从天空之城坐船去"}
      - {speaker: A, text: "还有船？？", emote: 5}
      - {speaker: B, text: "哈哈对，在天空之塔顶上，有个售票处"}
      - {speaker: A, text: "哦哦懂了多谢多谢", emote: 2}

  quest_help_2:
    participants: 2
    lines:
      - {speaker: A, text: "有人知道怎么去雪域吗？"}
      - {speaker: B, text: "去天空之城然后从塔往下走"}
      - {speaker: A, text: "整座塔都走？那得多久"}
      - {speaker: B, text: "大概20层吧哈哈"}
      - {speaker: A, text: "我服了", emote: 7}

  real_life_school:
    participants: 2
    lines:
      - {speaker: A, text: "唉我明天有个考试"}
      - {speaker: B, text: "巧了，我也是。数学？"}
      - {speaker: A, text: "对。完全没复习", emote: 7}
      - {speaker: B, text: "哈哈一样。没事我们能过的"}
      - {speaker: A, text: "想得美哈哈"}

  real_life_food:
    participants: 2
    lines:
      - {speaker: A, text: "你晚饭吃的啥"}
      - {speaker: B, text: "泡面哈哈"}
      - {speaker: A, text: "经典玩家燃料", emote: 2}
      - {speaker: B, text: "真不是我想吃，你信我", emote: 4}

  real_life_late_night:
    participants: 2
    lines:
      - {speaker: A, text: "老哥都凌晨3点了"}
      - {speaker: B, text: "然后呢？"}
      - {speaker: A, text: "你明天不上学吗"}
      - {speaker: B, text: "上啊，但再来一把"}
      - {speaker: A, text: "你一小时前也是这么说的哈哈", emote: 2}

  real_life_weather:
    participants: 2
    lines:
      - {speaker: A, text: "外面雨下得是真的大"}
      - {speaker: B, text: "窝在家里玩冒险岛的完美天气", emote: 0}
      - {speaker: A, text: "太对了"}

  nostalgia_old_maple:
    participants: 2
    lines:
      - {speaker: A, text: "兄弟还记得当年射手村打猎场人山人海的时候吗"}
      - {speaker: B, text: "记得记得，大家抢频道抢疯了", emote: 2}
      - {speaker: A, text: "然后有人抢你怪，你就去给他人气减一"}
      - {speaker: B, text: "哈哈人气大战，经典老冒险岛"}
      - {speaker: A, text: "那时候多美好啊", emote: 4}

  nostalgia_maple_island:
    participants: 2
    lines:
      - {speaker: A, text: "你还记得枫叶岛吗"}
      - {speaker: B, text: "废话，那些蜗牛"}
      - {speaker: A, text: "我记得我被蓝蜗牛打死过，因为不会用药水", emote: 7}
      - {speaker: B, text: "哈哈这也太惨了", emote: 2}
      - {speaker: A, text: "谁还没个萌新时期呢"}

  flex_compare:
    participants: 2
    lines:
      - {speaker: A, text: "看看我的新武器", emote: 3}
      - {speaker: B, text: "还行。花了多少"}
      - {speaker: A, text: "2亿枫币"}
      - {speaker: B, text: "老哥我150就能帮你搞到一个", emote: 5}
      - {speaker: A, text: "……别跟我说这个", emote: 4}

  flex_level:
    participants: 2
    lines:
      - {speaker: A, text: "今天刚上70级！！", emote: 2}
      - {speaker: B, text: "牛啊恭喜！", emote: 2}
      - {speaker: A, text: "三转比二转爽太多了"}
      - {speaker: B, text: "等你四转，完全是另一个游戏"}
      - {speaker: A, text: "等不及了"}

  afk_check:
    participants: 2
    lines:
      - {speaker: A, text: "在吗？"}
      - {speaker: B, text: "在在，刚才挂机去了"}
      - {speaker: A, text: "哈哈没事，还以为你掉线了"}
      - {speaker: B, text: "没有，就去倒了杯水"}

  scam_warning:
    participants: 2
    lines:
      - {speaker: A, text: "老哥刚才有人在自由市场想骗我"}
      - {speaker: B, text: "咋回事"}
      - {speaker: A, text: "他先放了张白卷，最后一秒换成10%卷"}
      - {speaker: B, text: "经典骗局。点交易前一定要再检查一遍", emote: 1}
      - {speaker: A, text: "是啊，我吃过亏才懂的", emote: 4}

  guild_talk:
    participants: 2
    lines:
      - {speaker: A, text: "你有公会吗？"}
      - {speaker: B, text: "有啊，Resilience，挺活跃的"}
      - {speaker: A, text: "他们收人吗？我正找公会呢"}
      - {speaker: B, text: "收，你私聊会长，就说我介绍你来的"}
      - {speaker: A, text: "好嘞谢啦！", emote: 2}

  boss_planning:
    participants: 2
    lines:
      - {speaker: A, text: "今晚打扎昆不？"}
      - {speaker: B, text: "几点"}
      - {speaker: A, text: "晚上8点？不过得有个主教"}
      - {speaker: B, text: "我问问我公会的人，他是130多级的主教"}
      - {speaker: A, text: "完美，就这么定了", emote: 2}

  scroll_results:
    participants: 2
    lines:
      - {speaker: A, text: "我刚用60%卷砸武器，连爆5张", emote: 6}
      - {speaker: B, text: "老哥60%卷就是骗人的，体感跟30%似的"}
      - {speaker: A, text: "真的，2亿枫币打水漂了"}
      - {speaker: B, text: "默哀"}

  scroll_results_2:
    participants: 2
    lines:
      - {speaker: A, text: "我60%卷刚砸了7中7！！", emote: 2}
      - {speaker: B, text: "不会吧。有图有真相", emote: 5}
      - {speaker: A, text: "千真万确，我手都在抖"}
      - {speaker: B, text: "老哥快去买张彩票"}
      - {speaker: A, text: "哈哈哈真的"}

  fashion_talk:
    participants: 2
    lines:
      - {speaker: A, text: "喂你这身衣服哪买的"}
      - {speaker: B, text: "商城，刚充了10刀的点券"}
      - {speaker: A, text: "值了，看着真帅", emote: 2}
      - {speaker: B, text: "嘿嘿，在射手村就得穿得体面点", emote: 3}

  money_problems:
    participants: 2
    lines:
      - {speaker: A, text: "我穷爆了", emote: 4}
      - {speaker: B, text: "多穷"}
      - {speaker: A, text: "就剩5万枫币那种穷"}
      - {speaker: B, text: "老哥这也叫穷，哈哈", emote: 2}
      - {speaker: A, text: "我知道啊，问题就在这", emote: 7}

  pet_talk:
    participants: 2
    lines:
      - {speaker: A, text: "买宠物值不值？"}
      - {speaker: B, text: "百分百值。自动捡东西能改变你的人生"}
      - {speaker: A, text: "那我该买哪只"}
      - {speaker: B, text: "无所谓，功能都一样，挑只你觉得可爱的"}
      - {speaker: A, text: "那就哈士奇了", emote: 0}

  maple_gf:
    participants: 2
    lines:
      - {speaker: A, text: "我冒险岛cp刚跟我分手了", emote: 4}
      - {speaker: B, text: "兄弟啥情况"}
      - {speaker: A, text: "她说她找到了个等级更高的"}
      - {speaker: B, text: "哈哈哈这也太扎心了", emote: 2}
      - {speaker: A, text: "痛"}

  random_encounter:
    participants: 2
    lines:
      - {speaker: A, text: "嘿"}
      - {speaker: B, text: "嘿"}
      - {speaker: A, text: "……"}
      - {speaker: B, text: "……"}
      - {speaker: A, text: "今天天气不错"}
      - {speaker: B, text: "哈哈"}

  coming_back:
    participants: 2
    lines:
      - {speaker: A, text: "我退坑3年刚回坑"}
      - {speaker: B, text: "欢迎回来！现在多少级"}
      - {speaker: A, text: "52。感觉自己又成萌新了哈哈"}
      - {speaker: B, text: "没事，你很快就能追上来的，现在升级容易多了"}
      - {speaker: A, text: "那就好", emote: 0}

  dc_frustration:
    participants: 2
    lines:
      - {speaker: A, text: "我打BOSS打到一半直接掉线了！！", emote: 6}
      - {speaker: B, text: "惨。位置丢了吧？"}
      - {speaker: A, text: "丢了，BUFF也全没了"}
      - {speaker: B, text: "太惨了。这服务器最近卡得要死"}
      - {speaker: A, text: "我心态真的崩了", emote: 1}

  fame_exchange:
    participants: 2
    lines:
      - {speaker: A, text: "互刷人气不？"}
      - {speaker: B, text: "好啊"}
      - {speaker: A, text: "我给你点了"}
      - {speaker: B, text: "回你了", emote: 2}
      - {speaker: A, text: "谢啦！"}

  job_advancement:
    participants: 2
    lines:
      - {speaker: A, text: "我马上要做三转了！！", emote: 2}
      - {speaker: B, text: "牛！转哪个？"}
      - {speaker: A, text: "转射手"}
      - {speaker: B, text: "稳。四连箭伤害爆表"}
      - {speaker: A, text: "等不及想试试了"}

  server_drama:
    participants: 2
    lines:
      - {speaker: A, text: "你听说昨天自由市场的瓜了吗"}
      - {speaker: B, text: "没有，咋了"}
      - {speaker: A, text: "有人复制道具被抓，封号了"}
      - {speaker: B, text: "哈哈活该，复制狗毁经济"}
      - {speaker: A, text: "说得对"}

  # ═══════════════════════════════════════
  #  3-PERSON CONVERSATIONS
  # ═══════════════════════════════════════

  pq_planning:
    participants: 3
    lines:
      - {speaker: A, text: "有人想打天空组队任务吗？"}
      - {speaker: B, text: "我来。你多少级？"}
      - {speaker: A, text: "58主教"}
      - {speaker: C, text: "加我一个，55隐士"}
      - {speaker: B, text: "完美，再找3个就行"}
      - {speaker: A, text: "天空之城2线集合"}
      - {speaker: C, text: "马上到"}

  pq_planning_2:
    participants: 3
    lines:
      - {speaker: A, text: "组队打废都任务，还差2人"}
      - {speaker: B, text: "你多少级"}
      - {speaker: A, text: "25刺客"}
      - {speaker: C, text: "我来，28牧师"}
      - {speaker: B, text: "好，我也来。废都集合"}
      - {speaker: A, text: "冲冲冲", emote: 2}

  best_town_debate:
    participants: 3
    lines:
      - {speaker: A, text: "射手村是冒险岛最好的村，不服来辩"}
      - {speaker: B, text: "不，魔法密林酷多了，那音乐还有大树"}
      - {speaker: C, text: "废都的氛围感才是一绝，那种黑暗小巷的调调"}
      - {speaker: A, text: "老哥废都就是个垃圾场哈哈", emote: 2}
      - {speaker: B, text: "他说得对，废都一股味儿"}
      - {speaker: C, text: "你们就是不懂欣赏", emote: 1}

  guild_drama:
    participants: 3
    lines:
      - {speaker: A, text: "老哥我们会长两周没上线了"}
      - {speaker: B, text: "又来？？上个月不是也这样"}
      - {speaker: C, text: "要不我们干脆自己建个公会"}
      - {speaker: A, text: "我就是这个意思。建会的枫币我够"}
      - {speaker: B, text: "那叫什么名字"}
      - {speaker: C, text: "整个帅气的，比如Oblivion之类的"}
      - {speaker: A, text: "哈哈行，容我想想"}

  someone_flexing:
    participants: 3
    lines:
      - {speaker: A, text: "卧槽我刚才抽百宝抽到混沌卷了！！", emote: 2}
      - {speaker: B, text: "不可能", emote: 5}
      - {speaker: C, text: "有图有真相"}
      - {speaker: A, text: "就在我背包里，看"}
      - {speaker: B, text: "老哥这能卖1亿多"}
      - {speaker: C, text: "或者自己砸了赌一把", emote: 3}
      - {speaker: A, text: "我要自己砸，人生能有几回搏"}
      - {speaker: B, text: "你是真猛", emote: 5}

  boss_fight_recap:
    participants: 3
    lines:
      - {speaker: A, text: "刚才那把扎昆打得太刺激了"}
      - {speaker: B, text: "我差点死了3次，真的", emote: 7}
      - {speaker: C, text: "我是真死了，还死了两次，哈哈", emote: 4}
      - {speaker: A, text: "好歹头盔掉落了"}
      - {speaker: B, text: "谁捡到了？"}
      - {speaker: A, text: "我，哈哈", emote: 3}
      - {speaker: C, text: "好家伙"}

  whos_strongest:
    participants: 3
    lines:
      - {speaker: A, text: "来，说说这里谁最强"}
      - {speaker: B, text: "那当然是我", emote: 3}
      - {speaker: C, text: "你才60级，冷静点", emote: 2}
      - {speaker: B, text: "等级不代表一切好吗"}
      - {speaker: A, text: "某种程度上还真能代表"}
      - {speaker: C, text: "哈哈哈"}

  late_night_group:
    participants: 3
    lines:
      - {speaker: A, text: "为什么我们凌晨4点都在线"}
      - {speaker: B, text: "因为我们毫无自制力"}
      - {speaker: C, text: "我7点就要上班了，真的", emote: 7}
      - {speaker: A, text: "那还不去睡？"}
      - {speaker: C, text: "再来一把"}
      - {speaker: B, text: "这就对了", emote: 2}

  training_recommendations:
    participants: 3
    lines:
      - {speaker: A, text: "喂我35级了去哪练级好"}
      - {speaker: B, text: "僵尸蘑菇就不错"}
      - {speaker: C, text: "不，去怪物嘉年华快多了"}
      - {speaker: B, text: "怪物嘉年华得有队伍才好打"}
      - {speaker: A, text: "我没有队伍啊哈哈"}
      - {speaker: C, text: "我陪你，走起"}
      - {speaker: A, text: "冲冲冲！", emote: 2}

  real_life_group:
    participants: 3
    lines:
      - {speaker: A, text: "你们都是哪个国家的"}
      - {speaker: B, text: "美国，加州"}
      - {speaker: C, text: "加拿大"}
      - {speaker: A, text: "我巴西的！"}
      - {speaker: B, text: "厉害了，冒险岛真是全球都在玩啊", emote: 2}
      - {speaker: C, text: "爱了爱了"}

  two_argue_third_mediates:
    participants: 3
    lines:
      - {speaker: A, text: "战士打BOSS就是纯混子"}
      - {speaker: B, text: "你说啥？那谁给你扛伤害", emote: 6}
      - {speaker: A, text: "谁喝药快谁都能扛"}
      - {speaker: C, text: "行了行了都冷静点，每个职业都有自己的作用"}
      - {speaker: B, text: "谢谢，总算有人讲道理"}
      - {speaker: A, text: "行吧，战士也还行，勉强"}
      - {speaker: C, text: "这就对了", emote: 0}

  halloween_event:
    participants: 3
    lines:
      - {speaker: A, text: "你们做万圣节活动了吗？"}
      - {speaker: B, text: "做了，这次奖励真的不错"}
      - {speaker: C, text: "啥奖励？"}
      - {speaker: A, text: "有个披风还有几把椅子"}
      - {speaker: B, text: "披风属性也挺好看的"}
      - {speaker: C, text: "那我加入。任务从哪开始？"}
      - {speaker: A, text: "找射手村公园里的NPC"}

  # ═══════════════════════════════════════
  #  4-PERSON CONVERSATIONS
  # ═══════════════════════════════════════

  party_formation:
    participants: 4
    lines:
      - {speaker: A, text: "好，谁要一起打天空组队任务"}
      - {speaker: B, text: "我，57牧师"}
      - {speaker: C, text: "算我一个，54射手"}
      - {speaker: D, text: "62隐士在此"}
      - {speaker: A, text: "完美，最好再来2个战士"}
      - {speaker: B, text: "我问问我朋友，他是黑骑"}
      - {speaker: D, text: "开整", emote: 2}

  group_reaction:
    participants: 4
    lines:
      - {speaker: A, text: "你们刚看见没！！", emote: 5}
      - {speaker: B, text: "啥？"}
      - {speaker: C, text: "看见啥？"}
      - {speaker: A, text: "有人把一张白卷扔地上了"}
      - {speaker: D, text: "哈哈谁这么虎", emote: 2}
      - {speaker: B, text: "是手滑吗？"}
      - {speaker: C, text: "可能是炫富，也可能就是手滑哈哈"}
      - {speaker: A, text: "不管怎样我心脏骤停了一下"}

  debate_2v2:
    participants: 4
    lines:
      - {speaker: A, text: "天空之城比玩具城好，不服来辩"}
      - {speaker: B, text: "同意，天空之城的音乐好听多了"}
      - {speaker: C, text: "你们疯了吧？？玩具有组队任务有塔还有玩具工厂"}
