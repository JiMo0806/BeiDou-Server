      - {speaker: D, text: "我用70%卷把一把完美武器砸爆了"}
      - {speaker: A, text: "天哪。我的是40分钟的跳跳任务在最后掉下去了"}
      - {speaker: B, text: "我们都受过苦", emote: 4}
      - {speaker: C, text: "这游戏锻炼人。这里的锻炼指的是心灵创伤"}
      - {speaker: D, text: "哈哈哈真实", emote: 2}

  what_class_to_make_next:
    participants: 4
    lines:
      - {speaker: A, text: "我要练个新号，选什么职业好"}
      - {speaker: B, text: "主教。每个队都需要，你永远不愁没队伍"}
      - {speaker: C, text: "不，练标飞。大伤害大快乐"}
      - {speaker: D, text: "必须黑骑。狂暴太离谱了"}
      - {speaker: A, text: "所以你们就是在推销自己玩的主职业呗"}
      - {speaker: B, text: "……可能吧", emote: 2}
      - {speaker: C, text: "哈哈还真是", emote: 3}
      - {speaker: D, text: "说真的，练个你觉得帅的就完事了，那才是最重要的"}
      - {speaker: A, text: "目前听到的最好建议"}

  party_quest_chaos:
    participants: 4
    lines:
      - {speaker: A, text: "刚才那场天空组队任务也太离谱了"}
      - {speaker: B, text: "帕帕精灵那一关是谁一直在死"}
      - {speaker: C, text: "是我，而且我不觉得丢人", emote: 7}
      - {speaker: D, text: "我全程一直在给你刷治疗", emote: 4}
      - {speaker: A, text: "哈哈我看到了，你蓝都快空了"}
      - {speaker: B, text: "好歹通关了！"}
      - {speaker: C, text: "险过，就剩30秒左右"}
      - {speaker: D, text: "赢了就是赢了。干得漂亮各位", emote: 2}

  town_hanging_out:
    participants: 4
    lines:
      - {speaker: A, text: "所以我们现在在干嘛"}
      - {speaker: B, text: "站街"}
      - {speaker: C, text: "找感觉"}
      - {speaker: D, text: "活着"}
      - {speaker: A, text: "我们不该去练级或者干点正事吗"}
      - {speaker: B, text: "不用，站街本身就是内容"}
      - {speaker: C, text: "射手村站街模拟器2009", emote: 2}
      - {speaker: D, text: "真正的终极副本，是我们在站街中收获的友情", emote: 0}

  # ═══════════════════════════════════════
  #  MORE 2-PERSON CONVERSATIONS
  # ═══════════════════════════════════════

  mount_talk:
    participants: 2
    lines:
      - {speaker: A, text: "你买坐骑了吗？"}
      - {speaker: B, text: "买了，那个猪的"}
      - {speaker: A, text: "不错。我想要任务给的那个，但做不完"}
      - {speaker: B, text: "哪个任务？"}
      - {speaker: A, text: "就是那个要收集一堆东西的，太磨人了"}
      - {speaker: B, text: "那种收集任务确实肝，不过值得，坐骑太帅了"}

  accidental_npc:
    participants: 2
    lines:
      - {speaker: A, text: "我刚不小心把武器卖给NPC了"}
      - {speaker: B, text: "不是吧。能买回来吗？"}
      - {speaker: A, text: "不能，永远没了", emote: 4}
      - {speaker: B, text: "太惨了。什么武器？"}
      - {speaker: A, text: "我砸了好几周卷的那把"}
      - {speaker: B, text: "……节哀", emote: 4}
      - {speaker: A, text: "让我静静"}

  buddy_list_full:
    participants: 2
    lines:
      - {speaker: A, text: "我好友列表满了，还想加更多人"}
      - {speaker: B, text: "同病相怜。但我一个都不想删"}
      - {speaker: A, text: "我列表里一半人都几个月没上线了，但我总觉得他们会回来"}
      - {speaker: B, text: "这是我这辈子听过最扎心的话", emote: 4}
      - {speaker: A, text: "没事，我很好"}

  boat_to_orbis:
    participants: 2
    lines:
      - {speaker: A, text: "去天空之城的船要坐多久？"}
      - {speaker: B, text: "大概5分钟"}
      - {speaker: A, text: "5分钟？？那这5分钟我干嘛"}
      - {speaker: B, text: "站在甲板上思考你的人生选择", emote: 2}
      - {speaker: A, text: "太真实了"}
      - {speaker: B, text: "对了小心船上的怪，很痛。"}

  potion_math:
    participants: 2
    lines:
      - {speaker: A, text: "你练级带多少药水？"}
      - {speaker: B, text: "大概300瓶"}
      - {speaker: A, text: "300瓶？！"}
      - {speaker: B, text: "我消耗得快嘛", emote: 2}
      - {speaker: A, text: "我带50瓶10分钟就喝光了"}
      - {speaker: B, text: "所以才要带300啊"}
      - {speaker: A, text: "……有道理"}

  storage_mule:
    participants: 2
    lines:
      - {speaker: A, text: "你有仓库小号吗？"}
      - {speaker: B, text: "有，大概3个"}
      - {speaker: A, text: "三个？"}
      - {speaker: B, text: "一个放卷轴，一个放装备，一个放杂货"}
      - {speaker: A, text: "也太有条理了"}
      - {speaker: B, text: "我知道我有病，但我乐意", emote: 2}

  trading_etiquette:
    participants: 2
    lines:
      - {speaker: A, text: "刚才有人找我交易，放了个错的东西然后取消了"}
      - {speaker: B, text: "经典钓鱼套路，自由市场天天有"}
      - {speaker: A, text: "而且很明显，他先放白卷然后调包"}
      - {speaker: B, text: "第二次检查一定要仔细，交易千万别急。"}
      - {speaker: A, text: "嗯，这次算轻松学到教训了"}
      - {speaker: B, text: "总比我们大多数人吃亏学到的强", emote: 0}

  grinding_music:
    participants: 2
    lines:
      - {speaker: A, text: "你刷怪的时候听什么？"}
      - {speaker: B, text: "一般听游戏自带的音乐，我喜欢"}
      - {speaker: A, text: "等等，真的假的？大部分人都是放自己的歌"}
      - {speaker: B, text: "不知道，BGM很搭那个氛围"}
      - {speaker: A, text: "行吧。魔法密林的音乐确实神"}
      - {speaker: B, text: "对吧？玩具城的也是"}
      - {speaker: A, text: "好吧，也许我该再试试"}

  daily_routine:
    participants: 2
    lines:
      - {speaker: A, text: "你每天上冒险岛的日常是啥？"}
      - {speaker: B, text: "上线，逛自由市场，练一小时级，然后射手村站街"}
      - {speaker: A, text: "跟我基本一样哈哈"}
      - {speaker: B, text: "我们都是习惯的动物", emote: 2}
      - {speaker: A, text: "逛自由市场那步最花时间"}
      - {speaker: B, text: "肯定的，自由市场就是个时间黑洞"}

  failed_scroll_story:
    participants: 2
    lines:
      - {speaker: A, text: "我今天用70%卷，砸失败了"}
      - {speaker: B, text: "70%？够倒霉的"}
      - {speaker: A, text: "连着两次。"}
      - {speaker: B, text: "……唉", emote: 7}
      - {speaker: A, text: "这些卷多少钱我就不提了"}
      - {speaker: B, text: "有时候游戏就是要轮到你受苦，没办法"}
      - {speaker: A, text: "今天确实轮到我了"}

  # ═══════════════════════════════════════
  #  MORE 3-PERSON CONVERSATIONS
  # ═══════════════════════════════════════

  best_bgm:
    participants: 3
    lines:
      - {speaker: A, text: "游戏里最好的BGM是哪个？"}
      - {speaker: B, text: "必须是射手村"}
      - {speaker: C, text: "不，魔法密林，精灵森林的氛围无可替代"}
      - {speaker: A, text: "我本来想说登录界面的音乐，不过你俩说的也都对"}
      - {speaker: B, text: "哦对，登录音乐，我都忘了"}
      - {speaker: C, text: "登录音乐怎么会忘？？那可是你听到的第一个声音！", emote: 5}
      - {speaker: B, text: "我每次都是狂按跳过，想赶紧进游戏哈哈"}

  fm_browsing:
    participants: 3
    lines:
      - {speaker: A, text: "自由市场太让人眼花了，商店太多了"}
      - {speaker: B, text: "一个房间一个房间慢慢逛呗"}
      - {speaker: C, text: "或者看喇叭广告，直接去找卖家"}
      - {speaker: A, text: "等我找到的时候，一半发喇叭的都走了"}
      - {speaker: B, text: "这就是自由市场的生活，手速要快"}
      - {speaker: C, text: "或者干脆自己开店，让他们来找你", emote: 3}
      - {speaker: A, text: "好大胆的策略"}

  who_has_the_best_pet:
    participants: 3
    lines:
      - {speaker: A, text: "最好的宠物是哪只？"}
      - {speaker: B, text: "那必须是哈士奇，全游戏最可爱"}
      - {speaker: C, text: "不，是龙。跟在你后面看着太帅了"}
      - {speaker: A, text: "我个人喜欢熊猫"}
      - {speaker: B, text: "熊猫也可爱"}
      - {speaker: C, text: "说实话功能都一样，自动捡就是自动捡"}
      - {speaker: A, text: "是，但帅是一辈子的"}
      - {speaker: B, text: "在冒险岛，帅才是唯一的硬通货", emote: 2}

  planning_boss:
    participants: 3
    lines:
      - {speaker: A, text: "这周末我们该去打个BOSS"}
      - {speaker: B, text: "行啊我来。什么时候合适？"}
      - {speaker: C, text: "周六晚上？"}
      - {speaker: A, text: "我没问题。8点左右？"}
      - {speaker: B, text: "定了。药水我管够"}
      - {speaker: C, text: "我也叫我公会的人来"}
      - {speaker: A, text: "人越多越热闹，就是别给我暴毙哈哈", emote: 2}

  event_discussion:
    participants: 3
    lines:
      - {speaker: A, text: "你们做现在的活动了吗？"}
      - {speaker: B, text: "做了，这次奖励确实还行"}
      - {speaker: C, text: "我还没开始。值得做吗？"}
      - {speaker: A, text: "有椅子和披风，所以值"}
      - {speaker: B, text: "光椅子就值回票价了"}
      - {speaker: C, text: "行，我今晚就开始。从哪开始？"}
      - {speaker: A, text: "找射手村的活动NPC"}

  random_henesys_encounter:
    participants: 3
    lines:
      - {speaker: A, text: "衣服不错"}
      - {speaker: B, text: "谢谢！刚从商城买的"}
      - {speaker: C, text: "多少钱？"}
      - {speaker: B, text: "呃……够花"}
      - {speaker: A, text: "那么贵是吧", emote: 2}
      - {speaker: B, text: "时尚是有代价的好吗", emote: 3}
      - {speaker: C, text: "尊重穿搭"}

  # ═══════════════════════════════════════
  #  MORE 4-PERSON CONVERSATIONS
  # ═══════════════════════════════════════

  fm_prices_debate:
    participants: 4
    lines:
      - {speaker: A, text: "是只有我觉得还是自由市场物价真的疯了"}
      - {speaker: B, text: "不是错觉，确实涨了"}
      - {speaker: C, text: "卷轴比一个月前贵太多了"}
      - {speaker: D, text: "因为大家都囤货"}
      - {speaker: A, text: "所以就是富的更富呗"}
      - {speaker: B, text: "自由市场经济就是这样"}
      - {speaker: C, text: "要不我不刷怪了，改行倒卖去"}
      - {speaker: D, text: "倒卖也是一种肝", emote: 0}

  henesys_vibes:
    participants: 4
    lines:
      - {speaker: A, text: "晚上的射手村是最棒的"}
      - {speaker: B, text: "同意。大家就站在那聊天的时候"}
      - {speaker: C, text: "就像个虚拟的聚会场所"}
      - {speaker: D, text: "本质就是个带可爱角色的聊天室"}
      - {speaker: A, text: "我觉得这样就挺好"}
      - {speaker: B, text: "我最棒的几次聊天就是在这个村子"}
      - {speaker: C, text: "说真的我也一样。冒险岛的友谊就是不一样"}
      - {speaker: D, text: "确实不同凡响。都是在组队任务和自由市场购物的火里淬炼出来的", emote: 2}

  who_is_the_richest:
    participants: 4
    lines:
      - {speaker: A, text: "你们认识的最有钱的人是谁？"}
      - {speaker: B, text: "我们公会有个老哥大概有50亿"}
      - {speaker: C, text: "50亿？！", emote: 5}
      - {speaker: D, text: "这怎么可能"}
      - {speaker: B, text: "他倒卖倒了好几年了"}
      - {speaker: A, text: "干这个我会疯掉"}
      - {speaker: C, text: "有人就是享受搞钱的过程"}
      - {speaker: D, text: "佩服。我连1000万都存不住，到手就花", emote: 4}

  what_do_you_do_when_bored:
    participants: 4
    lines:
      - {speaker: A, text: "你们在冒险岛无聊的时候都干嘛？"}
      - {speaker: B, text: "在射手村站街"}
      - {speaker: C, text: "逛自由市场"}
      - {speaker: D, text: "找路人搭话"}
      - {speaker: A, text: "所以就是我们此刻正在干的事"}
      - {speaker: B, text: "没错", emote: 2}
      - {speaker: C, text: "游戏里的游戏，就是社交本身"}
      - {speaker: D, text: "真正的终极副本内容"}

  # ═══════════════════════════════════════
  #  ANIME & GAMING CONVERSATIONS
  # ═══════════════════════════════════════

  anime_recommendation:
    participants: 2
    lines:
      - {speaker: A, text: "你看过咒术回战吗"}
      - {speaker: B, text: "看过，第二季太炸了"}
      - {speaker: A, text: "对吧？？那作画质量", emote: 5}
      - {speaker: B, text: "MAPPA 真是拼了。但代价是什么呢（说的就是他们的动画师）"}
      - {speaker: A, text: "哈哈确实。不过话说回来那个涩谷事变"}
      - {speaker: B, text: "别剧透，我认识有人还没看"}

  gaming_setup_brag:
    participants: 3
    lines:
      - {speaker: A, text: "刚买了个新显示器，144hz 的"}
      - {speaker: B, text: "为了玩冒险岛？？兄弟这可是 2003 年的 2D 游戏", emote: 2}
      - {speaker: C, text: "让他得意一下嘛"}
      - {speaker: A, text: "流畅度是真的提升好吧，连逛自由市场都更爽了"}
      - {speaker: B, text: "你在自我陶醉，但我尊重这份执着", emote: 3}
      - {speaker: C, text: "我用 2015 年的笔记本玩，照样好好的"}
      - {speaker: A, text: "这可不像你以为的那样值得炫耀"}

  fm_price_check:
    participants: 2
    lines:
      - {speaker: A, text: "喂，干净的拳套系钉现在卖多少钱"}
      - {speaker: B, text: "自由市场？看问谁咯哈哈"}
      - {speaker: A, text: "我刚看到有人刷 800 万，我直接笑了"}
      - {speaker: B, text: "800 万纯属抢钱，除非是满属性或者什么收藏家专供"}
      - {speaker: A, text: "兄弟我就知道，这服务器老让我觉得自己穷"}
      - {speaker: B, text: "欢迎来到奸商之都"}

  zakum_prereq_help:
    participants: 3
    lines:
      - {speaker: A, text: "等等，打扎昆需要做前置任务吗，还是直接走进去就行"}
      - {speaker: B, text: "你得先把那一堆钥匙的事做完"}
      - {speaker: C, text: "别忘了还有个坑爹 NPC 会让你莫名其妙横跨整张地图", emote: 6}
      - {speaker: A, text: "果然有一个坑爹 NPC"}
      - {speaker: B, text: "老冒险岛传统了"}
      - {speaker: C, text: "卡住了就在公会频道喊，总有人知道怎么做"}

  school_and_grind:
    participants: 2
    lines:
      - {speaker: A, text: "我发誓作业和冒险岛正在争夺我的灵魂"}
      - {speaker: B, text: "一样，我本来打开游戏想放松，结果数学练习册正盯着我"}
      - {speaker: A, text: "为什么老师总觉得我们精力无限"}
      - {speaker: B, text: "因为他们不知道刷 2 倍经验是什么感觉"}
      - {speaker: A, text: "太真实了。至少冒险岛不会搞突击测验"}
      - {speaker: B, text: "暂时还不会"}

  pq_party_waiting:
    participants: 3
    lines:
      - {speaker: A, text: "这队伍是凉了还是真在等最后一个人"}
      - {speaker: B, text: "等太久了，我连整张地图的布局都背下来了"}
      - {speaker: C, text: "抱歉刚才挂机了，我妈让我去倒垃圾"}
      - {speaker: A, text: "兄弟像传奇一样突然回归"}
      - {speaker: B, text: "我们刚才差点用一把椅子把你换了"}
      - {speaker: C, text: "讲道理，那把椅子的输出可能都比我高"}

  old_maple_nostalgia:
    participants: 2
    lines:
      - {speaker: A, text: "说实话，小时候觉得老版枫叶岛大得多"}
      - {speaker: B, text: "真的，每次走去射手村都感觉像在做任务"}
      - {speaker: A, text: "我以前觉得升到 30 级就差不多通关了"}
      - {speaker: B, text: "一样，还为我的小橙色药水骄傲过"}
      - {speaker: A, text: "现在的人到 120 级还一副无所谓的样子", emote: 2}
      - {speaker: B, text: "现在的年轻人根本不尊重刷蜗牛的苦日子"}

  anime_break_talk:
    participants: 4
    lines:
      - {speaker: A, text: "还有人在追这季新番吗，还是只剩我一个"}
      - {speaker: B, text: "我已经弃了一半了"}
      - {speaker: C, text: "一样，唯一还在追的就是那部讲恶魔的"}
      - {speaker: D, text: "不过 OP 太好听了，根本跳不过去", emote: 3}
      - {speaker: A, text: "确实，但上一集结束得太快了"}
      - {speaker: B, text: "一边开着冒险岛一边看，每集都结束得快"}

  sleep_deprived_gamer:
    participants: 2
    lines:
      - {speaker: A, text: "兄弟我怎么还醒着"}
      - {speaker: B, text: "因为你 4 小时前说“再刷一次”"}
      - {speaker: A, text: "这个描述精准得让我难受"}
      - {speaker: B, text: "你的眼睛现在估计长得像俩被劈开的蘑菇"}
      - {speaker: A, text: "画面感太强了，但确实"}
      - {speaker: B, text: "快下线喝水吧，免得开始幻听怪物刷新的音效"}

  scrolling_meltdown:
    participants: 3
    lines:
      - {speaker: A, text: "我刚才用最后一张卷把手套点爆了", emote: 4}
      - {speaker: B, text: "不不不，干净的时候属性多少"}
      - {speaker: C, text: "要是只剩 2 格我碰都不会碰"}
      - {speaker: A, text: "本来 3 格干净的，我贪了"}
      - {speaker: B, text: "贪婪才是冒险岛真正的 boss"}
      - {speaker: C, text: "这课我们都用昂贵的学费上过"}

  fashion_show_off:
    participants: 2
    lines:
      - {speaker: A, text: "说真的，我这身 NX 搭配是绝了还是我疯了"}
      - {speaker: B, text: "没疯，确实绝了"}
      - {speaker: A, text: "终于遇到有品味的人了"}
      - {speaker: B, text: "帽子是点睛之笔，整体造型也很成立"}
      - {speaker: A, text: "这是今天听到最中听的损人话了", emote: 2}
      - {speaker: B, text: "拿着这个胜利，慢慢走开就行"}

  lag_spike_hell:
    participants: 3
    lines:
      - {speaker: A, text: "是大家都掉线了，还是我的 WiFi 挂了"}
      - {speaker: B, text: "不是，服务器对我也卡得要死"}
      - {speaker: C, text: "我跳塔跳到一半直接被弹飞出平台了", emote: 5}
      - {speaker: A, text: "兄弟，这延迟跟你有私人恩怨吧"}
      - {speaker: B, text: "所以我从不信重置日的活动"}
      - {speaker: C, text: "不过要是能扛住橡皮筋回弹，经验白赚"}

  coding_and_maple:
    participants: 4
    lines:
      - {speaker: A, text: "写了一整天代码，现在只想在自由市场放空大脑"}
      - {speaker: B, text: "理解。我试过写个小脚本，结果莫名把我整台电脑搞崩了"}
      - {speaker: C, text: "经典程序员时刻", emote: 2}
      - {speaker: D, text: "有时候冒险岛居然比 debug 还简单"}
      - {speaker: A, text: "真的。至少怪物不会留全大写的评论"}
      - {speaker: B, text: "不过 NPC 的对话有时候真像代码"}

  winter_weather_chat:
    participants: 2
    lines:
      - {speaker: A, text: "今天也太冷了"}
      - {speaker: B, text: "讲道理，正是窝在家里刷怪的完美天气"}
      - {speaker: A, text: "你这么说是因为你哪都不用走"}
      - {speaker: B, text: "没错，而且我不觉得羞耻"}
      - {speaker: A, text: "我手指真的在键盘上冻僵了"}
      - {speaker: B, text: "技术问题，穿上袜子"}

  guild_drama_whispers:
    participants: 3
    lines:
      - {speaker: A, text: "喂，公会频道是不是又开始不对劲了"}
      - {speaker: B, text: "是啊，好像有两个人为了次 boss 团闹掰了"}
      - {speaker: C, text: "兄弟们搞得好像俩掉落能撼动经济似的", emote: 6}
      - {speaker: A, text: "我只想组队休闲一下，不想读小作文"}
      - {speaker: B, text: "一样。我进公会是玩冒险岛的，不是看肥皂剧的"}
      - {speaker: C, text: "不过还是比世界频道强"}

  console_vs_pc:
    participants: 2
    lines:
      - {speaker: A, text: "你觉得主机游戏还是比 PC 强吗"}
      - {speaker: B, text: "看情况。休闲游戏的话也许吧"}
      - {speaker: A, text: "不，PC 性能太强了。而且冒险岛的快捷键就是命"}
      - {speaker: B, text: "行吧有道理。用手柄玩冒险岛绝对是灾难"}
      - {speaker: A, text: "想象一下用手柄摇杆捡东西", emote: 2}
      - {speaker: B, text: "当场去世"}

  boss_practice_group:
    participants: 4
    lines:
      - {speaker: A, text: "好，快速过一遍，谁有净化"}
      - {speaker: B, text: "我。前提是我别失手丢人"}
      - {speaker: C, text: "我负责 buff，外加三个脑细胞"}
      - {speaker: D, text: "打这个 boss 说实话够用了", emote: 3}
      - {speaker: A, text: "好好好，这次别再站在危险区域里了"}
      - {speaker: C, text: "兄弟我就站进去过一次"}
      - {speaker: B, text: "每分钟一次的话，一次也算太多"}

  after_work_vibes:
    participants: 2
    lines:
      - {speaker: A, text: "刚下班，脑子已经烧糊了"}
      - {speaker: B, text: "一样，今天做客服差点没撑过来"}
      - {speaker: A, text: "我需要一把椅子、一杯饮料和零责任"}
      - {speaker: B, text: "所以……冒险岛的椅子、冒险岛的饮料，再无视公会消息"}
      - {speaker: A, text: "没错，梦想中的生活", emote: 2}
      - {speaker: B, text: "我们可真健康又高效啊"}

  wow_vs_maple:
    participants: 3
    lines:
      - {speaker: A, text: "你们有人也玩魔兽世界吗"}
      - {speaker: B, text: "试过，但月卡费伤了我的心"}
      - {speaker: C, text: "魔兽的团本玩家对配装较真得吓人"}
      - {speaker: A, text: "兄弟我只想蹦蹦跳跳赚枫币"}
      - {speaker: B, text: "合理。而且凌晨两点还是冒险岛的 BGM 更上头"}
      - {speaker: C, text: "射手村那首困倦的曲子无敌"}

  pet_hunger_panic:
    participants: 2
    lines:
      - {speaker: A, text: "我的宠物又饿了，我又忘了买粮"}
      - {speaker: B, text: "你怎么老是把小家伙晾着"}
      - {speaker: A, text: "因为我自己也在挨饿破产中"}
      - {speaker: B, text: "有道理。你们俩都在靠仙气续命"}
      - {speaker: A, text: "到这个地步我俩已经绑定销售了"}
      - {speaker: B, text: "赶紧去喂你儿子，别等它离家出走"}

  japanese_imports_talk:
    participants: 3
    lines:
      - {speaker: A, text: "我又花太多时间看日本海淘好物了"}
      - {speaker: B, text: "兄弟进入危险区了"}
      - {speaker: C, text: "每个爱好的终点都是一场财力 boss 战", emote: 2}
      - {speaker: A, text: "我一直跟自己说“就随便看看”，然后突然又多买了件东西"}
      - {speaker: B, text: "那不叫随便看看，那叫生活方式"}
      - {speaker: C, text: "至少冒险岛的囤货是虚拟的"}
      - {speaker: A, text: "但我的钱包感觉一点都不虚拟"}

  random_stranger_chitchat:
    participants: 2
    lines:
      - {speaker: A, text: "嘿，你这身装备其实挺好看的"}
      - {speaker: B, text: "哦谢谢哈哈，没想到会听到这个"}
      - {speaker: A, text: "配色搭得真好"}
      - {speaker: B, text: "你把我今天一天都照亮了"}
      - {speaker: A, text: "真的。对了你在哪练级"}
      - {speaker: B, text: "就一个无聊的练级点，努力别睡着而已"}

  sunday_evening_blues:
    participants: 4
    lines:
      - {speaker: A, text: "为什么周日晚总感觉像一种警告"}
      - {speaker: B, text: "因为周一正潜伏在窗外"}
      - {speaker: C, text: "在周一物理现身之前我拒绝承认它的存在", emote: 3}
      - {speaker: D, text: "一样。我们可以再玩一小时冒险岛装作没事"}
      - {speaker: A, text: "再一小时最后总能变成三小时"}
      - {speaker: B, text: "所以我们全都累成狗"}
      - {speaker: C, text: "不过值了"}

  fm_price_shock:
    participants: 2
    lines:
      - {speaker: A, text: "兄弟，是物价一夜暴涨还是我出现幻觉了"}
      - {speaker: B, text: "没幻觉，混沌卷最少涨了 1500 万", emote: 6}
      - {speaker: A, text: "搞什么，我今天本来正打算买一张"}
      - {speaker: B, text: "好像有个高级别公会在扫货想垄断"}
      - {speaker: A, text: "贪得无厌，我发誓我最恨自由市场的囤货狗", emote: 5}
      - {speaker: B, text: "等它凉呗哈哈，他们撑不住价格的"}

  runescape_vs_maple:
    participants: 3
    lines:
      - {speaker: A, text: "这里有人也玩江湖（RuneScape）吗"}
      - {speaker: B, text: "我以前在免费服天天玩丢物品交易哈哈"}
      - {speaker: C, text: "我还在小号上砍木头呢"}
      - {speaker: A, text: "牛啊，多少级了"}
      - {speaker: C, text: "72 左右吧。比冒险岛慢，但不知为啥更解压"}
      - {speaker: B, text: "说实话，江湖的刷法让冒险岛看起来像短跑"}
      - {speaker: A, text: "真的，那边任何一样 99 级都得练好几个月"}

  pc_flex:
    participants: 2
    lines:
      - {speaker: A, text: "终于把游戏电脑装好了"}
      - {speaker: B, text: "配置怎么样？", emote: 6}
      - {speaker: A, text: "NVIDIA 的，但贵得离谱。必须上最好的"}
      - {speaker: B, text: "兄弟拿 6090 玩冒险岛？？？认真的吗", emote: 2}
      - {speaker: A, text: "你不懂，现在显卡价格都疯了", emote: 3}
      - {speaker: B, text: "要是好看就行，回头发照片到 Discord"}

  gamer_fuel:
    participants: 2
    lines:
      - {speaker: A, text: "稍等，门铃响了外卖到了"}
      - {speaker: B, text: "又是你今天的炸鸡套餐？"}
      - {speaker: A, text: "对，外卖生活省了好多做饭时间", emote: 3}
      - {speaker: B, text: "我会饿死的，我刷怪每两小时就得吃点零食"}
      - {speaker: A, text: "习惯就好。刷怪时间更多了，冒险岛大于做饭"}

  monochrome_fashion:
    participants: 3
    lines:
      - {speaker: A, text: "出售透明帽子，5000 万或报价"}
      - {speaker: B, text: "你这身 NX 太清爽了，有那味儿"}
      - {speaker: A, text: "谢谢，我在努力配成我现实衣柜的风格"}
      - {speaker: C, text: "哈哈什么情况？你现实中只穿黑白灰？"}
      - {speaker: A, text: "对，最近在入潮牌，感觉不错"}
      - {speaker: B, text: "烧钱爱好，但尊重这份穿搭", emote: 3}
      - {speaker: C, text: "与此同时我在游戏里穿着一套正经的热狗玩偶服"}

  skate_injury:
    participants: 2
    lines:
      - {speaker: A, text: "打字有点怪，因为昨天玩滑板把手腕摔了"}
      - {speaker: B, text: "哦惨了，没事吧？怎么回事"}
      - {speaker: A, text: "试着豚跳三级台阶结果滑飞了。经典的心理不够坚定"}
      - {speaker: B, text: "疼吧……至少你还能用鼠标玩对吧？", emote: 2}
      - {speaker: A, text: "勉强能哈哈，二段跳的键都按不利索了", emote: 4}

  game_maker_hobbyist:
    participants: 4
    lines:
      - {speaker: A, text: "聊天里有没有程序员"}
      - {speaker: B, text: "我在学校学 Java"}
      - {speaker: C, text: "我是软件开发，主要做网页"}
      - {speaker: D, text: "我就用 Game Maker 随便做点小游戏玩"}
      - {speaker: A, text: "哦不错，什么类型的游戏"}
      - {speaker: D, text: "就是些平台跳跃之类的，不正经做，图个乐"}
      - {speaker: C, text: "唉真希望我下班后还有力气写代码哈哈"}
      - {speaker: B, text: "一样，我只想关掉大脑去敲蜗牛"}

  sleep_deprived:
    participants: 2
    lines:
      - {speaker: A, text: "你那边几点了"}
      - {speaker: B, text: "凌晨 4 点半……怎么了", emote: 6}
      - {speaker: A, text: "兄弟快去睡，你在这张图待了 8 个小时了"}
      - {speaker: B, text: "再升一级。89 级近在咫尺，我都能尝到味道了"}
      - {speaker: A, text: "你迟早会趴在键盘上睡着，然后被小雪人干掉"}
      - {speaker: B, text: "死就死吧", emote: 3}

  pineapple_pizza_war:
    participants: 4
    lines:
      - {speaker: A, text: "点披萨，要不要菠萝"}
      - {speaker: B, text: "要！点！"}
      - {speaker: C, text: "恶心死了，别毁披萨"}
      - {speaker: D, text: "配墨西哥辣椒其实不错，甜辣组合"}
      - {speaker: A, text: "B 被踢出队伍了，但 D 说得有道理"}
      - {speaker: C, text: "甜水果就不该出现在热芝士上，句号", emote: 5}
      - {speaker: B, text: "你味蕾没发育好，暴露了"}
      - {speaker: D, text: "打起来打起来打起来"}

  nostalgia_trip:
    participants: 2
    lines:
      - {speaker: A, text: "还记得以前升到 30 级要花一个月吗"}
      - {speaker: B, text: "记得，坐船去玩具城然后被红色蝙蝠魔吓死", emote: 2}
      - {speaker: A, text: "天哪大家挤在船舱里躲着"}
      - {speaker: B, text: "而且总有那么一个高级玩家出去装结果死了"}
      - {speaker: A, text: "好时光啊哈哈。现在的冒险岛完全不一样了"}

  scrolled_weapon_flex:
    participants: 3
    lines:
      - {speaker: A, text: "看我刷的全服频道"}
      - {speaker: B, text: "什么鬼，你在这件上连中三张 10% 卷？？", emote: 6}
      - {speaker: C, text: "我的天，神级运气"}
      - {speaker: A, text: "点最后一格的时候我手都在抖", emote: 3}
      - {speaker: B, text: "你卖多少钱，开个价"}
      - {speaker: A, text: "非卖品，纯属炫耀，抱歉了兄弟们"}
      - {speaker: C, text: "封号处理，你运气好得不正常"}

  lurk_and_return:
    participants: 2
    lines:
      - {speaker: A, text: "回来了？"}
      - {speaker: B, text: "嗯抱歉，刚去洗了个车"}
      - {speaker: A, text: "这种天气洗车？我这边正下暴雨呢"}
      - {speaker: B, text: "阳光加州的福利吧哈哈"}
      - {speaker: A, text: "真羡慕，我在纽约冻得屁股都要掉了"}

  anime_hot_take:
    participants: 3
    lines:
      - {speaker: A, text: "鬼灭之刃完全是靠飞碟社的作画撑起来的"}
      - {speaker: B, text: "你今天起床就选择了开战是吧"}
      - {speaker: C, text: "不过他说得对，剧情就是套模板的少年漫"}
      - {speaker: B, text: "但打斗燃爆了啊，谁在乎深度剧情"}
      - {speaker: A, text: "我是说好看是好看，但有人给它打 10 分当神作就离谱"}
      - {speaker: C, text: "扎实 7 分，靠经费抬上来的"}

  jump_quest_rage:
    participants: 2
    lines:
      - {speaker: A, text: "谁设计的 B2 跳跳任务，我只想跟他聊聊", emote: 5}
      - {speaker: B, text: "哈哈那个激光时机太变态了"}
      - {speaker: A, text: "我在最后一步摔下来了。就是最后一步"}
      - {speaker: B, text: "默哀。昨天我花了 2 小时才做完"}
      - {speaker: A, text: "我要下线了，免得把空格键砸了"}

  guild_drama_tea:
    participants: 3
    lines:
      - {speaker: A, text: "你们听说第一公会为什么解散了吗"}
      - {speaker: B, text: "没啊，怎么回事"}
      - {speaker: C, text: "吃瓜时间到，我听着呢"}
      - {speaker: A, text: "据说会长偷了公会金库的枫币去点一把完美枪"}
      - {speaker: B, text: "兄弟不会吧，真的假的？", emote: 6}
      - {speaker: C, text: "想象一下为了一把像素武器毁掉整个公会哈哈"}
      - {speaker: A, text: "最惨的是那把武器最后一张卷点爆了"}
      - {speaker: B, text: "报应是真实存在的哈哈哈哈", emote: 2}

  winamp_grind_vibes:
    participants: 2
    lines:
      - {speaker: A, text: "你刷怪的时候听什么歌"}
      - {speaker: B, text: "就一些下载的轻音乐，主要是动漫原声"}
      - {speaker: A, text: "不错，我一般要么电音要么金属，没有中间项"}
      - {speaker: B, text: "玩可爱蘑菇游戏配死亡金属，反差感拉满", emote: 2}

  awkward_strangers:
    participants: 2
    lines:
      - {speaker: A, text: "椅子不错"}
      - {speaker: B, text: "谢了"}
      - {speaker: A, text: "哪弄的"}
      - {speaker: B, text: "扭蛋机"}
      - {speaker: A, text: "哦不错"}
      - {speaker: B, text: "嗯"}

  manga_snob:
    participants: 3
    lines:
      - {speaker: A, text: "电锯人动画真好看"}
      - {speaker: B, text: "漫画好多了，动画风格太电影化"}
      - {speaker: C, text: "挑战：让漫画党别说“漫画更好”（不可能完成）", emote: 2}
      - {speaker: B, text: "我是认真的，后面几章的画风炸裂"}
      - {speaker: A, text: "我还是继续看漂亮的色彩和动画吧谢谢"}

  fame_trade:
    participants: 2
    lines:
      - {speaker: A, text: "互刷人气？"}
      - {speaker: B, text: "行，你先"}
      - {speaker: A, text: "好了"}
      - {speaker: B, text: "谢了已回", emote: 3}
      - {speaker: A, text: "祝你愉快，练级顺利"}

  training_spot_recommendation:
    participants: 2
    lines:
      - {speaker: A, text: "喂，有人在废都塔练级吗"}
      - {speaker: B, text: "我现在在沙漠地带，僵尸掉的钱还不错"}
      - {speaker: A, text: "沙漠地带也太卡了吧兄弟"}
      - {speaker: B, text: "确实，但只要你扛得住掉线，经验很香"}
      - {speaker: A, text: "我还是回射手村打猎吧"}
      - {speaker: B, text: "哈哈经典选择"}

  fm_price_complaint:
    participants: 3
    lines:
      - {speaker: A, text: "为什么扎昆头盔卷现在要 8 亿了，搞什么"}
      - {speaker: B, text: "上周有个土豪一口气买了 20 张"}
      - {speaker: C, text: "倒卖已死"}
      - {speaker: A, text: "我记得以前才 2 亿"}
      - {speaker: B, text: "一样啊兄弟，经济完蛋了"}
      - {speaker: C, text: "到头来还是自己刷 boss 吧"}
      - {speaker: A, text: "说起来容易做起来难"}

  pq_fail_story:
    participants: 2
    lines:
      - {speaker: A, text: "刚在玩具城组队任务里第五次团灭"}
      - {speaker: B, text: "这次又是怎么回事"}
      - {speaker: A, text: "法师老是被计时器搞死"}
      - {speaker: B, text: "哈哈经典。需要更好的配合"}
      - {speaker: A, text: "对，我今天不碰组队任务了"}
      - {speaker: B, text: "理解，要不要改去废弃矿坑双人练级？"}

  guild_drama_spill:
    participants: 4
    lines:
      - {speaker: A, text: "你们听说了吗，管理员昨晚把 shadowblade 踢了"}
      - {speaker: B, text: "不会吧，他干什么了"}
      - {speaker: C, text: "好像是用 NX 骗了个会员"}
      - {speaker: D, text: "兄弟当时公会频道炸了"}
      - {speaker: A, text: "我从一开始就觉得他不对劲"}
      - {speaker: B, text: "一样，老是炫耀些假货"}
      - {speaker: C, text: "公会从来就没有不撕的时候"}

  old_maple_nostalgia:
    participants: 2
    lines:
      - {speaker: A, text: "还记得枫叶岛以前真觉得很大的"}
      - {speaker: B, text: "对，还有以前刷蜗牛的日子"}
      - {speaker: A, text: "现在一切都太快了"}
      - {speaker: B, text: "也怀念以前的活动"}
      - {speaker: A, text: "还有大变革还没出的年代"}
      - {speaker: B, text: "那时候我们还是孩子啊，好时光"}

  boss_strategy_talk:
    participants: 3
    lines:
      - {speaker: A, text: "你们怎么躲扎昆的触手"}
      - {speaker: B, text: "看动作前摇就行兄弟"}
      - {speaker: C, text: "我用蹲角落战术"}
      - {speaker: A, text: "那玩意有用？？"}
      - {speaker: B, text: "有时候吧。主要靠祈祷"}
      - {speaker: C, text: "哈哈太真实了"}
      - {speaker: A, text: "下次我试试"}

  jump_quest_rant:
    participants: 2
    lines:
      - {speaker: A, text: "这个勇士部落跳跳任务要把我搞死了"}
      - {speaker: B, text: "哪个，绳子的那个？"}
      - {speaker: A, text: "对，我老在最后一段掉下去"}
      - {speaker: B, text: "要练的，我第一次摔了差不多 50 次"}
      - {speaker: A, text: "兄弟为什么这么难"}
      - {speaker: B, text: "只是又一个冒险岛时刻而已"}

  server_lag_frustration:
    participants: 3
    lines:
      - {speaker: A, text: "这延迟真没法玩了"}
      - {speaker: B, text: "一样，一直把我掉线"}
      - {speaker: C, text: "每个周末都这样"}
      - {speaker: A, text: "他们得换个好点的服务器"}
      - {speaker: B, text: "或者至少提前说一声"}
      - {speaker: C, text: "先挂机等它平息吧"}

  other_mmo_comparison:
    participants: 2
    lines:
      - {speaker: A, text: "你以前玩过江湖（RuneScape）吗"}
      - {speaker: B, text: "玩过，那刷法是真的肝"}
      - {speaker: A, text: "跟它比冒险岛算休闲的了"}
      - {speaker: B, text: "确实，不过江湖有那种自由感"}
      - {speaker: A, text: "这次档清空之后我可能回去玩"}
      - {speaker: B, text: "我也想"}

  gaming_setup_talk:
    participants: 3
    lines:
      - {speaker: A, text: "终于换了新鼠标，雷蛇的"}
      - {speaker: B, text: "为了玩冒险岛？有点杀鸡用牛刀了吧"}
      - {speaker: C, text: "让他玩去"}
      - {speaker: A, text: "高 DPI 对微操有帮助"}
      - {speaker: B, text: "你说话像个主播"}
      - {speaker: C, text: "下一步是不是要给 2D 游戏上机械键盘"}

  retro_games_chat:
    participants: 2
    lines:
      - {speaker: A, text: "最近在玩宝可梦水晶"}
      - {speaker: B, text: "真玩家。我的 Game Boy 还留着呢"}
      - {speaker: A, text: "那份怀旧感完全不一样"}
      - {speaker: B, text: "冒险岛是我的童年，宝可梦也是"}
      - {speaker: A, text: "哪天我们应该交换一下哈哈"}
      - {speaker: B, text: "我奉陪"}

  esports_debate:
    participants: 2
    lines:
      - {speaker: A, text: "哈哈无畏契约的职业哥太猛了"}
      - {speaker: B, text: "不过冒险岛的 PVP 才是巅峰"}
      - {speaker: A, text: "兄弟冒险岛 PVP 就是卡顿加抢怪"}
      - {speaker: B, text: "还是比看直播好玩"}
      - {speaker: A, text: "有道理"}
      - {speaker: B, text: "好怀念以前的冒险岛比赛"}

  anime_current_season:
    participants: 3
    lines:
      - {speaker: A, text: "最近有什么好看的新番吗"}
      - {speaker: B, text: "刚开始看钢之炼金术师，太好看了"}
      - {speaker: C, text: "总算看了。后面剧情会炸裂"}
      - {speaker: A, text: "我是边刷怪边看的"}
      - {speaker: B, text: "一样，能解闷"}
      - {speaker: C, text: "不过别忘了升级"}

  music_grind_style:
    participants: 2
    lines:
      - {speaker: A, text: "你练级的时候听什么"}
      - {speaker: B, text: "主要是动漫原声，能让我专注"}
      - {speaker: A, text: "我直接上日系摇滚，假装自己在打 boss"}
      - {speaker: B, text: "这招说实话也行"}
      - {speaker: A, text: "打扎昆配林肯公园，绝配"}
      - {speaker: B, text: "经典"}

  school_exam_stress:
    participants: 2
    lines:
      - {speaker: A, text: "这周期中考，要了我命了"}
      - {speaker: B, text: "一样，我基本没复习"}
      - {speaker: A, text: "我把时间都拿来刷冒险岛了哈哈"}
      - {speaker: B, text: "轻重缓急拿捏得真好"}
      - {speaker: A, text: "以后会后悔的"}
      - {speaker: B, text: "我们俩都会"}

  gamer_food_talk:
    participants: 3
    lines:
      - {speaker: A, text: "晚饭又是泡面"}
      - {speaker: B, text: "兄弟吃点正经东西吧"}
      - {speaker: C, text: "披萨卷党前来报到"}
      - {speaker: A, text: "在组队任务里哪有空做饭"}
      - {speaker: B, text: "借口"}
      - {speaker: C, text: "我凌晨两点吃的麦片"}
      - {speaker: A, text: "传奇"}

  sleep_schedule_rant:
    participants: 2
    lines:
      - {speaker: A, text: "又通宵了"}
      - {speaker: B, text: "为了冒险岛还是作业"}
      - {speaker: A, text: "都有……主要是冒险岛"}
      - {speaker: B, text: "你得把作息调回来"}
      - {speaker: A, text: "这话从一个天天凌晨 4 点在线的人嘴里说出来"}
      - {speaker: B, text: "有被扎到"}

  weekend_plans:
    participants: 4
    lines:
      - {speaker: A, text: "这周末大家干嘛"}
      - {speaker: B, text: "为四转刷级"}
      - {speaker: C, text: "睡觉，然后接着睡"}
      - {speaker: D, text: "唉，要陪家人"}
      - {speaker: A, text: "我们应该组织一次公会 boss 团"}
      - {speaker: B, text: "我来"}
      - {speaker: C, text: "我要是醒得来就算我一个"}

  pet_talk:
    participants: 3
    lines:
      - {speaker: A, text: "我家的猫老是在我键盘上踩"}
      - {speaker: B, text: "哈哈我家的也是，专挑打 boss 的时候"}
      - {speaker: C, text: "宠物才是真正的 boss"}
      - {speaker: A, text: "至少它们可爱"}
      - {speaker: B, text: "对，比卡顿强"}
      - {speaker: C, text: "真理"}

  pineapple_pizza_debate:
    participants: 2
    lines:
      - {speaker: A, text: "披萨加菠萝是顶级享受"}
      - {speaker: B, text: "你是真的疯了"}
      - {speaker: A, text: "甜咸组合懂不懂"}
      - {speaker: B, text: "这是对人类的犯罪"}
      - {speaker: A, text: "那我全吃了"}
      - {speaker: B, text: "你的怪披萨自己享用吧"}

  scroll_anxiety:
    participants: 2
    lines:
      - {speaker: A, text: "我准备给武器点卷了。60% 的"}
      - {speaker: B, text: "直接点，别多想"}
      - {speaker: A, text: "但万一失败呢，我已经 5/7 了"}
      - {speaker: B, text: "兄弟你已经盯着它十分钟了", emote: 6}
      - {speaker: A, text: "好好好我点了……正在点……"}
      - {speaker: B, text: "然后呢？？"}
      - {speaker: A, text: "过了！！！冲啊！！！", emote: 2}
      - {speaker: B, text: "6/7 你是传奇。再中一张就完美了"}

  runescape_comparison:
    participants: 2
    lines:
      - {speaker: A, text: "你玩过江湖（RuneScape）吗？"}
      - {speaker: B, text: "很久以前玩过。砍木头一砍就是几小时哈哈"}
      - {speaker: A, text: "那边的刷法让冒险岛显得轻松"}
      - {speaker: B, text: "至少冒险岛技能华丽。江湖就是看进度条涨"}
      - {speaker: A, text: "确实，但有种禅意"}
      - {speaker: B, text: "你刚刚描述的就是挂机哈哈", emote: 2}

  exam_procrastination:
    participants: 3
    lines:
      - {speaker: A, text: "我 6 小时后有一场期末考"}
      - {speaker: B, text: "然后你在玩冒险岛？？？", emote: 6}
      - {speaker: C, text: "这是我见过最有共鸣的一幕"}
      - {speaker: A, text: "我在压力下学习效率更高好吗"}
      - {speaker: B, text: "每个人挂科前都是这么说的"}
      - {speaker: C, text: "让他去搏一把。大不了重修"}
      - {speaker: A, text: "就是这个理。谢谢你 C", emote: 2}
      - {speaker: B, text: "明天别哭着来找我们"}

  sleep_schedule_destroyed:
    participants: 2
    lines:
      - {speaker: A, text: "你那边几点了"}
      - {speaker: B, text: "凌晨 4 点半"}
      - {speaker: A, text: "兄弟快去睡觉"}
      - {speaker: B, text: "睡不着。现在睡了下午两点才醒"}
      - {speaker: A, text: "那是你自己的问题哈哈"}
      - {speaker: B, text: "我的作息已经彻底崩了", emote: 4}
      - {speaker: A, text: "夏日假期专属状态"}

  fm_price_outrage:
    participants: 3
    lines:
      - {speaker: A, text: "兄弟，有人在卖 2 亿一张的白卷"}
      - {speaker: B, text: "上周才 8000 万，发生什么了"}
      - {speaker: C, text: "倒爷干的。他们扫光所有货然后抬价"}
      - {speaker: A, text: "这也太不要脸了", emote: 5}
      - {speaker: B, text: "供需关系罢了，欢迎来到自由市场"}
      - {speaker: C, text: "所以我一直穷。拒绝参与"}
      - {speaker: A, text: "这也算一种骨气吧"}

  anime_music_grind:
    participants: 2
    lines:
      - {speaker: A, text: "你刷怪的时候听什么"}
      - {speaker: B, text: "主要是动漫 OP。火影、死神、犬夜叉"}
      - {speaker: A, text: "经典。休闲地图我会加古典钢琴"}
      - {speaker: B, text: "古典乐配射手村的地图确实意外地搭"}
      - {speaker: A, text: "配着火影原声打扎昆，绝无仅有"}
      - {speaker: B, text: "宅男与玩家的完美交集", emote: 2}

  food_while_gaming:
    participants: 3
    lines:
      - {speaker: A, text: "大家打游戏标配零食是什么"}
      - {speaker: B, text: "火辣奇多。我的键盘已经永久性变橙了"}
      - {speaker: C, text: "太恶心了。我像文明人一样吃葡萄"}
      - {speaker: A, text: "葡萄？？也太随机了哈哈"}
      - {speaker: B, text: "不，葡萄其实是打游戏神器。不脏手"}
      - {speaker: C, text: "谢谢。总算有人懂", emote: 3}
      - {speaker: A, text: "我个人是薯片蘸酱党"}
      - {speaker: B, text: "你那可怜的键盘……"}

  guild_drama:
    participants: 2
    lines:
      - {speaker: A, text: "你听说 Legends 公会的瓜了吗"}
      - {speaker: B, text: "哪一段？那公会常年有瓜哈哈"}
      - {speaker: A, text: "会长踢了 5 个人，就因为没参加 boss 团"}
      - {speaker: B, text: "太狠了。有些人冒险岛之外还有生活的好吧"}
      - {speaker: A, text: "他们被踢之前就是这么说的，然后集体退会了"}
      - {speaker: B, text: "公会政治真是野"}

  dying_at_boss:
    participants: 4
    lines:
      - {speaker: A, text: "好了，都准备好打扎了吗"}
      - {speaker: B, text: "生来就绪"}
      - {speaker: C, text: "等等，让我嗑药"}
      - {speaker: D, text: "我忘带药水了"}
      - {speaker: A, text: "D……你是认真的吗？", emote: 5}
      - {speaker: B, text: "笑死，每次都这样"}
      - {speaker: D, text: "马上回来，给我 2 分钟", emote: 7}
      - {speaker: C, text: "所以我们从来没法按时通关"}
      - {speaker: A, text: "那你慢慢来吧……"}

  typing_speed:
    participants: 2
    lines:
      - {speaker: A, text: "你打字怎么这么快"}
      - {speaker: B, text: "多年在冒险岛频道里吵架练出来的哈哈"}
      - {speaker: A, text: "说真的，一分钟 100 词？"}
      - {speaker: B, text: "不知道，可能吧。没测过。纯粹是肌肉记忆"}
      - {speaker: A, text: "我大概一分钟 40 词，太慢了", emote: 4}
      - {speaker: B, text: "再玩五年冒险岛你就到了"}

  fashion_compliment:
    participants: 2
    lines:
      - {speaker: A, text: "喂你这身穿搭真辣"}
      - {speaker: B, text: "谢谢！在点装商店泡了太久哈哈", emote: 7}
      - {speaker: A, text: "配色协调得非常到位"}
      - {speaker: B, text: "我对像素时装非常认真"}
      - {speaker: A, text: "佩服。我的角色看起来像个小丑"}

  old_maple_nostalgia:
    participants: 3
    lines:
      - {speaker: A, text: "还记得枫叶岛上真的有人的年代吗"}
      - {speaker: B, text: "而且你得跟每个 NPC 对话才知道去哪"}
      - {speaker: C, text: "我好怀念在废都下水道里迷路"}
      - {speaker: A, text: "那里面的音乐还有点瘆人"}
      - {speaker: B, text: "那时候干什么都像冒险。现在我们只会冲 200 级"}
      - {speaker: C, text: "大概这就是长大吧", emote: 4}
      - {speaker: A, text: "我没哭，你才哭了"}

  death_note_debate:
    participants: 2
    lines:
      - {speaker: A, text: "暴论：死亡笔记在 L 死后就崩了"}
      - {speaker: B, text: "这都不算暴论，这就是事实"}
      - {speaker: A, text: "尼亚和梅洛跟 L 比太平庸了"}
      - {speaker: B, text: "尼亚就是没有个性的 L"}
      - {speaker: A, text: "就该在第 25 集完结"}
      - {speaker: B, text: "不过薯片那场戏是传奇，那个必须保留", emote: 3}

  build_pc_advice:
    participants: 3
    lines:
      - {speaker: A, text: "在考虑组装一台电脑。有什么建议吗？"}
      - {speaker: B, text: "预算多少？"}
      - {speaker: A, text: "大概 800 到 1000"}
      - {speaker: C, text: "这预算能配台不错的。锐龙 5 加块像样的显卡"}
      - {speaker: B, text: "电源别省钱。相信我这句"}
      - {speaker: A, text: "记下了。显卡有推荐吗？"}
      - {speaker: C, text: "看你是不是只想玩冒险岛哈哈"}
      - {speaker: B, text: "冒险岛烤面包机都能跑。随便买", emote: 2}
      - {speaker: A, text: "我也玩别的游戏的好吧"}

  jump_quest_rage:
    participants: 2
    lines:
      - {speaker: A, text: "我在这个跳跳任务卡了 45 分钟了"}
      - {speaker: B, text: "哪一个"}
      - {speaker: A, text: "雪域那个全是小平台的"}
      - {speaker: B, text: "哦不。我上周在那上面耗了 2 小时", emote: 4}
      - {speaker: A, text: "我要疯了。老是在同一段掉下去"}
      - {speaker: B, text: "小技巧：别看计时器，越看越糟"}
      - {speaker: A, text: "晚了，我已经心态崩到无法修复了", emote: 5}

  stranger_interaction:
    participants: 2
    lines:
      - {speaker: A, text: "嘿"}
      - {speaker: B, text: "咋了"}
      - {speaker: A, text: "披风不错"}
      - {speaker: B, text: "哦谢谢哈哈，其实是随机掉的"}
      - {speaker: A, text: "羡慕。我想弄一条好久了"}
      - {speaker: B, text: "你早晚会有的。随机数就是这样"}
      - {speaker: A, text: "嗯。那祝你顺利，回见"}
      - {speaker: B, text: "你也是兄弟，悠着点", emote: 2}

  weekend_plans_convo:
    participants: 4
    lines:
      - {speaker: A, text: "这周末有人有安排吗？"}
      - {speaker: B, text: "睡觉加冒险岛。没了。"}
      - {speaker: C, text: "我周六上班但周日有空"}
      - {speaker: D, text: "周六晚上有聚会，之后会上线"}
      - {speaker: A, text: "那我们周日组织一次团体 boss 吧"}
      - {speaker: B, text: "我整周末都有空。说个时间就行"}
      - {speaker: C, text: "周日下午我可以"}
      - {speaker: D, text: "我估计会宿醉但没问题", emote: 6}
      - {speaker: A, text: "完美。周日下午 3 点（美东时间）。不见不散"}

  afk_return:
    participants: 2
    lines:
      - {speaker: A, text: "喂你还在吗？"}
      - {speaker: A, text: "喂喂？？"}
      - {speaker: B, text: "抱歉哈哈刚才挂机了。我妈喊我吃饭"}
      - {speaker: A, text: "兄弟都过了 20 分钟了，我以为你掉线了", emote: 6}
      - {speaker: B, text: "没有，就是吃饭。我回来了，怎么了"}
      - {speaker: A, text: "没事了，我忘了我要说什么哈哈"}

  conspiracy_theory_silly:
    participants: 3
    lines:
      - {speaker: A, text: "我觉得爆率跟一天里的时间段有关"}
      - {speaker: B, text: "不是这么算的哈哈"}
      - {speaker: C, text: "不不等等，我发誓凌晨 3 点掉的东西就是更好"}
      - {speaker: A, text: "看吧，不止我一个人这么觉得"}
      - {speaker: B, text: "兄弟们那只是确认偏误"}
      - {speaker: C, text: "那你解释一下为什么我昨晚凌晨 4 点连出 3 件稀有"}
      - {speaker: A, text: "服务器知道你什么时候最上头", emote: 3}
      - {speaker: B, text: "你们都在瞎想，不过以防万一我今晚也试试"}

  scroll_gamble_regret:
    participants: 2
    lines:
      - {speaker: A, text: "我刚想把工作手套点 10% 卷，结果爆了", emote: 4}
      - {speaker: B, text: "哦不。点了几个格子了"}
      - {speaker: A, text: "5 格，中 2 张然后爆炸。我想哭"}
      - {speaker: B, text: "兄弟中 2 张就该停了，那已经是干净的了"}
      - {speaker: A, text: "我当时感觉手气好。大错特错"}
      - {speaker: B, text: "爆炸前人人都会觉得自己手气好哈哈"}
      - {speaker: A, text: "再也不碰 10% 卷了。再也不。", emote: 5}
      - {speaker: B, text: "人人都这么说，然后下周接着点"}

  henesys_nostalgia:
    participants: 3
    lines:
      - {speaker: A, text: "还记得射手村到处都是人站着发呆的年代吗"}
      - {speaker: B, text: "天哪是的，射手村市场那种氛围绝了"}
      - {speaker: C, text: "全靠聊天频道打字卖东西，乱成一锅粥"}
      - {speaker: A, text: "我以前能纯在那儿逛几个小时，正经游戏都不玩"}
      - {speaker: B, text: "那会儿就像个城镇广场，大家都在闲逛"}
      - {speaker: C, text: "还有每 5 秒全大写刷屏出售的人", emote: 3}
      - {speaker: A, text: "虽然烦人，但还真有点怀念"}
      - {speaker: B, text: "一样。莫名感觉那才叫有活气"}

  training_map_crowded:
    participants: 2
    lines:
      - {speaker: A, text: "老兄，我的练级图上有 4 个人"}
      - {speaker: B, text: "哪张图"}
      - {speaker: A, text: "我在火野猪那，结果今天所有人都跑来了"}
      - {speaker: B, text: "烦死了。图一挤经验直接报废"}
      - {speaker: A, text: "我现在大概只有平时 40% 的速度", emote: 5}
      - {speaker: B, text: "换线呗"}
      - {speaker: A, text: "我查了每个地方都是满的，今天就是那种日子"}
      - {speaker: B, text: "周末大军。每个周六准时上演"}
      - {speaker: A, text: "要不我回自由市场蹲着等高峰过去"}

  guild_drama_aftermath:
    participants: 3
    lines:
      - {speaker: A, text: "那你听说昨晚 redleaf 出什么事了吗"}
      - {speaker: B, text: "没有，怎么了"}
      - {speaker: A, text: "velkan 基本上是在公会频道公开怼管理员，然后被踢了"}
      - {speaker: C, text: "等等，是 140 多级的那个 velkan？？"}
      - {speaker: A, text: "对。整件事炸开了锅，之后走了 6 个人左右"}
      - {speaker: B, text: "他到底在气什么"}
      - {speaker: A, text: "好像是 boss 掉落分配不公平之类的"}
      - {speaker: C, text: "这场大戏已经酝酿好几周了", emote: 6}
      - {speaker: B, text: "公会总是因为战利品分配散伙。每次都是"}

  rare_drop_moment:
    participants: 2
    lines:
      - {speaker: A, text: "兄弟！！我刚掉了一对星形耳环！！", emote: 12}
      - {speaker: B, text: "不会吧！！从哪掉的？？"}
      - {speaker: A, text: "小蝙蝠魔。我完全没想到会出这个"}
      - {speaker: B, text: "那至少值 30 万。恭喜！！！"}
      - {speaker: A, text: "我人有点抖哈哈，我从来不掉稀有的"}
      - {speaker: B, text: "这是属于你的冒险岛高光时刻。别卖太便宜"}
      - {speaker: A, text: "已经在去自由市场查价的路上了", emote: 11}
      - {speaker: B, text: "祝好运。肯定会有人想要的"}

  bishop_appreciation:
    participants: 2
    lines:
      - {speaker: A, text: "就想说一句，主教是全游戏最被低估的职业"}
      - {speaker: B, text: "大声点说。没人尊重治疗和 buff 的苦修"}
      - {speaker: A, text: "带着全队打扎昆，伤害功劳却只算一半"}
      - {speaker: B, text: "而且所有人都觉得你净化复活是理所当然，连句客气话都没有"}
      - {speaker: A, text: "有人连着复活我 3 次，一个字都没说。连声谢都没有"}
      - {speaker: B, text: "至少说个请吧我的天", emote: 5}
      - {speaker: A, text: "好主教的价值用枫币都衡量不了，人们根本意识不到"}
      - {speaker: B, text: "说得太对了。我也练了一个，就为了体会这份苦"}

  meso_saving_debate:
    participants: 3
    lines:
      - {speaker: A, text: "我在攒 5000 万。已经忍着两周啥都没买了"}
      - {speaker: B, text: "攒 5000 万干嘛"}
      - {speaker: A, text: "我想买个扎昆头盔。现在价格太离谱了"}
      - {speaker: C, text: "要是能进团就自己打扎昆啊"}
      - {speaker: A, text: "我还没到 140，根本进不去"}
      - {speaker: B, text: "买一个更快。就是需要耐心"}
      - {speaker: C, text: "我攒了 3 周，刚买完价格就跌了哈哈", emote: 6}
      - {speaker: A, text: "那是我最可怕的噩梦"}
      - {speaker: B, text: "凑够钱就买别等。价格只有一个方向"}

  class_switch_temptation:
    participants: 2
    lines:
      - {speaker: A, text: "我一直在想转职重新玩个暗影神偷"}
      - {speaker: B, text: "你是战士吧。为什么要换"}
      - {speaker: A, text: "暗影神偷太帅了，打 boss 看起来也好玩得多"}
      - {speaker: B, text: "但装备投入太狠了。短剑不便宜"}
      - {speaker: A, text: "我知道，但我玩枪骑士有点玩腻了"}
      - {speaker: B, text: "经典这山望着那山高。暗影神偷也在抱怨哈哈"}
      - {speaker: A, text: "他们抱怨什么"}
      - {speaker: B, text: "主要是烧钱。还有暗杀有时候会直接 miss", emote: 3}
      - {speaker: A, text: "行吧，那我暂时继续玩枪。但我还是会心动的"}

  free_market_haggling:
    participants: 2
    lines:
      - {speaker: A, text: "你这个枫叶盾卖 90 万，但我在别处见过 60 万的"}
      - {speaker: B, text: "那些的属性多半不一样，先看清再比价"}
      - {speaker: A, text: "在我看来属性一样。11 防是标准的吧"}
      - {speaker: B, text: "这样吧，85 万。不能再低了"}
      - {speaker: A, text: "75 万。这张图就值这个价"}
      - {speaker: B, text: "80 万成交。最终报价"}
      - {speaker: A, text: "……行吧。80 万。成交", emote: 2}
      - {speaker: B, text: "合作愉快。盾拿好"}

  skill_build_argument:
    participants: 3
    lines:
      - {speaker: A, text: "如果你是刺客，应该先满极速再点运镖"}
      - {speaker: B, text: "不对，永远先运镖。前期伤害更重要"}
      - {speaker: A, text: "但极速让手感顺滑多了，攻速很重要"}
      - {speaker: C, text: "两种我都试过。为了练级速度，先运镖是对的"}
      - {speaker: B, text: "谢谢，终于有人同意了"}
      - {speaker: A, text: "你们都错了，我坚持己见", emote: 5}
      - {speaker: C, text: "不过如果有法师给你加速，极速还能再往后拖"}
      - {speaker: B, text: "那又是另一场大战了"}
      - {speaker: A, text: "说实话随便选一个坚持玩就行。都管用"}

  orbis_pq_memories:
    participants: 2
    lines:
      - {speaker: A, text: "还有人玩天空组队任务吗，还是凉透了"}
      - {speaker: B, text: "挺冷清的。以前天空之塔那里挤满人"}
      - {speaker: A, text: "排队是真折磨，但莫名其妙还挺好玩"}
      - {speaker: B, text: "我在入口大厅站队认识了一堆随机好友"}
      - {speaker: A, text: "去天空之城的船程也基本是社交时间"}
      - {speaker: B, text: "大家会在船上一起打怪，就那么闲逛着", emote: 2}
      - {speaker: A, text: "冒险岛真有最好的发呆时刻。光是待着就有趣"}
      - {speaker: B, text: "组好队之后，天空组队任务本身也挺好玩的"}

  dark_knight_vs_hero:
    participants: 2
    lines:
      - {speaker: A, text: "打 boss 选黑骑士还是英雄。快说"}
      - {speaker: B, text: "英雄。黑暗精灵是帅，但实际输出英雄更强"}
      - {speaker: A, text: "黑骑士有黑暗精灵 buff 和牺牲，工具性拉满"}
      - {speaker: B, text: "英雄有激怒和斗气打爆发。持久战纯伤害为王"}
      - {speaker: A, text: "黑骑士更肉，打混沌本的时候很关键"}
      - {speaker: B, text: "有道理。单说打扎昆的话黑骑士可能更稳"}
      - {speaker: A, text: "我就是觉得黑暗精灵帅，帅也是一种价值", emote: 3}
      - {speaker: B, text: "这理由选职业完全成立。颜值就是正义"}

  party_buffing_etiquette:
    participants: 3
    lines:
      - {speaker: A, text: "我们能不能立个规矩，祝福要提前喊再放，不是放完才说"}
      - {speaker: B, text: "哈哈怎么了"}
      - {speaker: A, text: "主教在开场就把我的加速覆盖掉了"}
      - {speaker: C, text: "哎。祝福和加速撞车确实容易乱"}
      - {speaker: B, text: "理想做法是开打前在队伍频道定好顺序"}
      - {speaker: A, text: "但从来没人这么干。大家上去就是放"}
      - {speaker: C, text: "我一直按法师 buff 优先，然后战士，最后牧师。挺好用"}
      - {speaker: B, text: "这就该成为通用标准才对", emote: 2}
      - {speaker: A, text: "广而告之。buff 顺序能救命"}

  late_night_grind:
    participants: 2
    lines:
      - {speaker: A, text: "凌晨 2 点了，我还在骨头龙这刷。救命"}
      - {speaker: B, text: "一样。我在僵尸那停不下来。就再升一级"}
      - {speaker: A, text: "“再升一级”这句话我已经说了 3 个小时了", emote: 14}
      - {speaker: B, text: "半夜服务器安静的时候，经验条走得特别舒心"}
      - {speaker: A, text: "真的。莫名有种平静感"}
      - {speaker: B, text: "我大概 4 小时后就得起了哈哈"}
      - {speaker: A, text: "我也是，但冒险岛时间不管现实时间"}
      - {speaker: B, text: "好好好，这次真的要下线了"}
      - {speaker: A, text: "信你个鬼。估计 30 分钟后又能见到你"}

  quitting_and_returning:
    participants: 2
    lines:
      - {speaker: A, text: "我真退坑了大概 8 个月，上周刚回来"}
      - {speaker: B, text: "欢迎回来哈哈。怎么想通了"}
      - {speaker: A, text: "说实话就是怀旧上头了。想念这种感觉"}
      - {speaker: B, text: "谁都逃不掉。这游戏有引力"}
      - {speaker: A, text: "没想到我还记得那么多配点和练级点"}
      - {speaker: B, text: "肌肉记忆不会忘。你的手指记得连招", emote: 2}
      - {speaker: A, text: "有些东西得重新学，但上手很快"}
      - {speaker: B, text: "这就是冒险岛。回来总像回家"}

  fame_farming_discussion:
    participants: 3
    lines:
      - {speaker: A, text: "现在还有人真的在乎人气值吗"}
      - {speaker: B, text: "不太在乎了，但看它涨还是爽"}
      - {speaker: C, text: "有些商店还把人气当进店价格的门槛"}
      - {speaker: A, text: "以前自由市场商店靠人气验资来交易也太怪了"}
      - {speaker: B, text: "我攒了 200 人气才发现根本没人查", emote: 6}
      - {speaker: C, text: "跟陌生人互刷人气那会儿其实还挺社交的"}
      - {speaker: A, text: "真的。刷人气的时候认识了不少有意思的人"}
      - {speaker: B, text: "那基本上就是每天免费的跟陌生人说话的理由"}

  fm_room_navigation:
    participants: 2
    lines:
      - {speaker: A, text: "为什么自由市场的房间编号这么难懂"}
      - {speaker: B, text: "就是啊。我在自由市场迷路 10 分钟就为找个人"}
      - {speaker: A, text: "我永远记不住哪个传送门通向哪个区"}
      - {speaker: B, text: "我的策略就是乱穿传送门赌运气", emote: 3}
      - {speaker: A, text: "地图名义上是有的，但一点用没有"}
      - {speaker: B, text: "设计自由市场布局的人脑回路相当独特"}
      - {speaker: A, text: "我都是直接背下要去的店，直奔过去"}
      - {speaker: B, text: "记住布局之后就是肌肉记忆了。不过得几周"}

  boss_prep_checklist:
    participants: 2
    lines:
      - {speaker: A, text: "30 分钟后打扎昆。准备好了吗"}
      - {speaker: B, text: "还得先买 300 瓶红药"}
      - {speaker: A, text: "你至少还得备一组万能药。它的手打人很疼"}
      - {speaker: B, text: "我需要命中装备吗，还是基础命中够了"}
      - {speaker: A, text: "你这个等级基础够了。保险起见戴个命中戒指吧"}
      - {speaker: B, text: "行，这就去买药。你复活准备好了吗"}
      - {speaker: A, text: "主教朋友说没问题，应该稳了"}
      - {speaker: B, text: "好。打手阶段我至少死一次哈哈", emote: 7}
      - {speaker: A, text: "说实话我也是。硬扛过去就完了"}

  alt_character_confession:
    participants: 3
    lines:
      - {speaker: A, text: "我有 4 个小号，而且我对此感到愧疚"}
      - {speaker: B, text: "愧疚什么。小号很正常"}
      - {speaker: A, text: "因为没一个超过 60 级，而我还在不停开新号"}
      - {speaker: C, text: "完了，你是小号狂魔。我一眼就看出来了", emote: 3}
      - {speaker: A, text: "我就是对新职业上头，然后很快就失去兴趣"}
      - {speaker: B, text: "不过新角色前 30 级的手感是真的新鲜"}
      - {speaker: C, text: "然后撞上刷级墙，再去开下一个新号"}
      - {speaker: A, text: "完全正确。这是个循环，我打破不了"}
      - {speaker: B, text: "总有一个会留下来的。只是还没找到你的本命职业"}

  nx_cosmetic_priorities:
    participants: 2
    lines:
      - {speaker: A, text: "要是给你 3 万点券，你最先买什么"}
      - {speaker: B, text: "理发券，没有争议。先好看再说别的"}
      - {speaker: A, text: "我在想商店里那套连身装挺不错的"}
      - {speaker: B, text: "暮色漫游者那套？对，很干净利落"}
      - {speaker: A, text: "不过帽子栏位难办。跟大多数装备帽都冲突"}
      - {speaker: B, text: "所以点装帽永远是第一优先级。解放你的穿搭"}
      - {speaker: A, text: "有道理。那先点装帽再买套装，还是先理发？"}
      - {speaker: B, text: "先理发。发型之外的一切都是次要的", emote: 3}

  el_nath_cold_complaints:
    participants: 2
    lines:
      - {speaker: A, text: "为什么雪域的寒冷 debuff 每次都能惹毛我"}
      - {speaker: B, text: "是屏幕上飘雪花对吧。太分散注意力了"}
      - {speaker: A, text: "让一切动作都变迟钝，还丑"}
      - {speaker: B, text: "上去之前先在最下面那个 NPC 那买解冻药就行"}
      - {speaker: A, text: "我老是忘。每次来都忘"}
      - {speaker: B, text: "至少不被每 3 秒冻一次的时候，这地图挺好看的"}
      - {speaker: A, text: "不过这上面的音乐不错，很有氛围感"}
      - {speaker: B, text: "雪域氛围加分，寒冷机制扣分", emote: 4}

  pq_partner_search:
    participants: 3
    lines:
      - {speaker: A, text: "招废都组队任务队友，还差 3 人"}
      - {speaker: B, text: "你们什么等级段"}
      - {speaker: A, text: "35 到 50 都行。我们有牧师，buff 不愁"}
      - {speaker: C, text: "哦哦我 41 级，能加吗"}
      - {speaker: A, text: "可以！！什么职业"}
      - {speaker: C, text: "冰雷法师。落雷已经点好了"}
      - {speaker: B, text: "打石头人那关很猛。我也来吧，我是侠盗"}
      - {speaker: A, text: "完美，出发。入口传送门集合", emote: 11}

  scroll_success_witness:
    participants: 2
    lines:
      - {speaker: A, text: "喂，我刚亲眼看到有人用 70% 卷连点 7 次工作手套全中"}
      - {speaker: B, text: "太离谱了。这概率得多低"}
      - {speaker: A, text: "他都疯了。在自由市场里蹦来蹦去"}
      - {speaker: B, text: "换我我也疯。70% 连中 7 次就是奇迹"}
      - {speaker: A, text: "他把一个干净的工作手套点成了近乎完美的。看得我头皮发麻"}
      - {speaker: B, text: "想复刻这个得烧 5000 万的黑暗卷吧", emote: 12}
      - {speaker: A, text: "就是。那是自由市场的传奇时刻。大家都在欢呼"}
      - {speaker: B, text: "真希望我当时也在场"}

  leveling_speed_comparison:
    participants: 2
    lines:
      - {speaker: A, text: "你花了多久升到 120"}
      - {speaker: B, text: "说实话，休闲着玩大概 3 个月吧。也可能 4 个月"}
      - {speaker: A, text: "还行啊。我卡在 118 都 3 周了"}
      - {speaker: B, text: "115 到 120 之间的墙是真的。经验需求暴涨"}
      - {speaker: A, text: "我在骨头龙那，但抢图太狠了"}
      - {speaker: B, text: "试试错峰时段。比如深夜或者大清早"}
      - {speaker: A, text: "要不我定个早上 6 点的闹钟，听着挺疯但"}
      - {speaker: B, text: "我干过。不丢人。清晨的空图就是宝藏", emote: 2}

  guild_boss_run_planning:
    participants: 4
    lines:
      - {speaker: A, text: "好了，公会打扎，周六晚 7 点。谁能来"}
      - {speaker: B, text: "我来。之前得先嗑药"}
      - {speaker: C, text: "我上班到 6 点，最晚 7 点半肯定上线"}
      - {speaker: D, text: "我有空。这次确定有主教了吗"}
      - {speaker: A, text: "taeyang 说能来，所以复活有保障"}
      - {speaker: B, text: "还需要再招人吗，还是我们已经有 6 个了"}
      - {speaker: C, text: "想打得顺最好至少 8 人"}
      - {speaker: A, text: "我去招募频道发帖。还差 2 个"}
      - {speaker: D, text: "确保他们至少有 100 防的装备。上次太惨了", emote: 5}
  losing_track_of_time:
    participants: 2
    lines:
      - {speaker: A, text: "兄弟我本来只想玩一个小时 结果一坐下五个小时过去了"}
      - {speaker: B, text: "冒险岛的时间用的是另一套时钟 这是个公认的现象"}
      - {speaker: A, text: "我真以为才晚上九点 结果已经半夜了"}
      - {speaker: B, text: "说实话你八成是进入心流状态了", emote: 3}
      - {speaker: A, text: "我一直在连刷任务副本 随便找队伍都是秒组"}
      - {speaker: B, text: "组队这么顺的时候你根本不想停下来"}
      - {speaker: A, text: "我明早还有课呢 这决定真是绝了"}
      - {speaker: B, text: "懂 我也经历过 不过值得对吧"}
      - {speaker: A, text: "……说实话确实值", emote: 2}

  training_spot_etiquette:
    participants: 3
    lines:
      - {speaker: A, text: "如果已经有人在地图上练级 你们是换线还是留下"}
      - {speaker: B, text: "看地图大小 大图可以一起刷 小图就换线"}
      - {speaker: C, text: "我总是先问一句 就类似 嘿 这图有人吗 这种"}
      - {speaker: A, text: "大部分人只要你开口问都很好说话 最烦的是那些一声不吭直接挤进来的"}
      - {speaker: B, text: "对啊那真的很烦 至少跟人家打个招呼吧"}
      - {speaker: C, text: "有人直接在我旁边开刷 一个字都不说", emote: 6}
      - {speaker: A, text: "然后还得你自己去提这事 别提多尴尬了"}
      - {speaker: B, text: "练级地图的社交契约是真实存在的 必须被尊重"}

  mage_skill_rotation:
    participants: 2
    lines:
      - {speaker: A, text: "火毒法师打boss的时候你的技能循环是怎么排的"}
      - {speaker: B, text: "基本就是毒雾 然后陨石 元素 amplification 触发了就放"}
      - {speaker: A, text: "你会在间隙里穿插普攻 还是就等毒雾跳伤害"}
      - {speaker: B, text: "我在空档里扔火箭 毒雾干活的时候让伤害不断"}
      - {speaker: A, text: "缓速术对boss战和练级分别有多重要"}
      - {speaker: B, text: "打boss不太有用 大部分boss免疫 平时练级倒是很好用"}
      - {speaker: A, text: "有道理 火毒感觉挺复杂 但玩明白之后特别爽"}
      - {speaker: B, text: "算是操作感最强的玩法之一了 绝不无聊", emote: 2}

  henesys_market_gossip:
    participants: 3
    lines:
      - {speaker: A, text: "有人在射手村半价卖雪花镖"}
      - {speaker: B, text: "八成是假的 要不就是急着要枫币"}
      - {speaker: C, text: "我看到了 属性看着是真的"}
      - {speaker: A, text: "可能就是有人清仓罢了 有时候会这样"}
      - {speaker: B, text: "或者是倒狗故意挂便宜 之后再拿到别处转手"}
      - {speaker: C, text: "哇我还真没想到这一层 阴啊", emote: 6}
      - {speaker: A, text: "有些人把自由市场玩成了一门生意"}
      - {speaker: B, text: "而且他们赚的枫币比任何肝帝都多多了 哈哈"}

  slow_leveling_acceptance:
    participants: 2
    lines:
      - {speaker: A, text: "我在73级卡了两个星期 我一点都不觉得丢人"}
      - {speaker: B, text: "这心态真的不错 这游戏本来就是马拉松"}
      - {speaker: A, text: "我就是想玩的时候才玩 不急着冲到哪里去"}
      - {speaker: B, text: "真羡慕你 我总是太纠结那个等级数字"}
      - {speaker: A, text: "享受过程而不是追着目的地跑 就会轻松很多"}
      - {speaker: B, text: "好有哲理 你是偷偷当哲学家了还是单纯懒 哈哈"}
      - {speaker: A, text: "可能一半一半吧", emote: 3}
      - {speaker: B, text: "服了 聊完这波我也试着对我的等级看开点"}

  warrior_weapon_debate:
    participants: 2
    lines:
      - {speaker: A, text: "黑骑士毕业期用枪还是矛 哪个更强"}
      - {speaker: B, text: "枪打的目标多 练级很爽 但矛单体伤害更高"}
      - {speaker: A, text: "专门打扎昆的话 我倾向于用矛打手臂"}
      - {speaker: B, text: "对 主打boss的build用矛更合理"}
      - {speaker: A, text: "不过攻速差多少 影响大吗"}
      - {speaker: B, text: "开了加速之后差距很小 论群刷枪稍微占优"}
      - {speaker: A, text: "唉 为什么就不能简单点"}
      - {speaker: B, text: "战士永远都在吵这个 挑个用着顺手的就行", emote: 2}

  drop_rate_conspiracy:
    participants: 2
    lines:
      - {speaker: A, text: "我发誓我连杀越猛的时候爆率越差"}
      - {speaker: B, text: "就像游戏在惩罚你打得太好"}
      - {speaker: A, text: "就是 连杀500只啥都不给 杀3只就出稀有"}
      - {speaker: B, text: "那纯粹是随机概率跟你的期望对着干 哈哈"}
      - {speaker: A, text: "道理我都懂 但它就是不像随机的"}
      - {speaker: B, text: "那是你的大脑在没有规律的地方硬找规律", emote: 3}
      - {speaker: A, text: "我的脑子错了但它自己特别笃定"}
      - {speaker: B, text: "经典冒险岛体验 玩得越上头 随机数越针对你"}

  maple_anniversary_memories:
    participants: 3
    lines:
      - {speaker: A, text: "当年的周年庆活动是真的棒"}
      - {speaker: B, text: "蛋糕怪物地图！！又乱又好玩！"}
      - {speaker: C, text: "所有人都在刷周年币换活动戒指"}
      - {speaker: A, text: "还有白送的各种道具 感觉像开派对"}
      - {speaker: B, text: "周年帽子很稀有 之后大家能炫耀好久"}
      - {speaker: C, text: "我第一个周年帽子现在还留在某个小号上"}
      - {speaker: A, text: "那时候的活动真让人觉得全服在一起庆祝", emote: 2}
      - {speaker: B, text: "那时候的冒险岛是真的懂怎么做社区活动"}

  party_finding_struggle:
    participants: 2
    lines:
      - {speaker: A, text: "找副本队伍找了25分钟了 没一个人在招人"}
      - {speaker: B, text: "哪个副本"}
      - {speaker: A, text: "废都副本 有人在那等但没人愿意当队长"}
      - {speaker: B, text: "经典了 所有人都想进队 但没人想组织"}
      - {speaker: A, text: "我倒是可以带队 但我还没搞懂所有关卡的解法"}
      - {speaker: B, text: "论坛有攻略 花5分钟就能学会基本的"}
      - {speaker: A, text: "那要不我来当吧 能有多难"}
      - {speaker: B, text: "你肯定行的 只要你说自己是第一次带队 大家一般都很有耐心", emote: 2}

  potion_expense_complaining:
    participants: 3
    lines:
      - {speaker: A, text: "我上周光药水就花了200万枫币 两百万"}
      - {speaker: B, text: "你多少级了 也太多了吧"}
      - {speaker: A, text: "我130级 骷髅龙那图简直吞药如喝水"}
      - {speaker: C, text: "你试过用特殊药水代替红药吗 有时候换算下来更划算"}
      - {speaker: A, text: "单价是贵一点 但撑得久吧"}
      - {speaker: B, text: "真正的解法是交个主教朋友 哈哈 花圣光加治愈直接改变一切"}
      - {speaker: C, text: "我自从跟一个主教朋友一起刷 药钱直接省了一半"}
      - {speaker: A, text: "那我上哪按需领养一个主教朋友", emote: 6}
      - {speaker: B, text: "公会招人呗 永远缺主教"}

  guild_recruitment_pitch:
    participants: 2
    lines:
      - {speaker: A, text: "嘿 要不要加个公会 我们挺活跃的"}
      - {speaker: B, text: "是个什么样的公会"}
      - {speaker: A, text: "休闲向 但每周打两次boss 20个成员"}
      - {speaker: B, text: "有等级要求吗"}
      - {speaker: A, text: "只要过了二转就行 我们不太看等级"}
      - {speaker: B, text: "氛围怎么样 是肝帝团还是娱乐团"}
      - {speaker: A, text: "基本就是玩得开心 公会频道天天开玩笑"}
      - {speaker: B, text: "行 这听着不错 怎么加", emote: 2}
      - {speaker: A, text: "我现在就发你邀请 欢迎上船"}

  job_advance_celebration:
    participants: 3
    lines:
      - {speaker: A, text: "兄弟们我刚完成三转了！！", emote: 12}
      - {speaker: B, text: "冲冲冲！！！转的什么"}
      - {speaker: A, text: "黑骑士宝贝 眼魔现在是我的了"}
      - {speaker: C, text: "哦黑骑士太帅了 真心的恭喜"}
      - {speaker: A, text: "转职任务有点烦 但绝对值"}
      - {speaker: B, text: "眼魔用起来手感怎么样"}
      - {speaker: A, text: "爽爆了 就像带了个小跟班一路给我加buff"}
      - {speaker: C, text: "相信我 眼魔献祭在boss战里会救你一命", emote: 2}
      - {speaker: A, text: "这是我几个月来在冒险岛里最开心的一天"}

  losing_a_good_scroll:
    participants: 2
    lines:
      - {speaker: A, text: "我刚在浴袍上卷砸了一张60% 我现在不想玩了"}
      - {speaker: B, text: "天啊 上面原来有什么"}
      - {speaker: A, text: "之前已经过了两张60% 这次本来想凑个三连"}
      - {speaker: B, text: "结果第三张炸了 这得多讽刺"}
      - {speaker: A, text: "早知道过两张就该收手 明明有稳的 非要赌"}
      - {speaker: B, text: "两张的浴袍已经算不错的东西了 别扔了", emote: 4}
      - {speaker: A, text: "我知道 我只是在哀悼那个本可能的三连"}
      - {speaker: B, text: "给你10分钟就会好受点的 卷轴之痛终会过去"}

  unexpected_pk_encounter:
    participants: 2
    lines:
      - {speaker: A, text: "刚才有人在僵尸蘑菇那抢我怪 还骂我菜"}
      - {speaker: B, text: "哈哈经典 你怎么处理的"}
      - {speaker: A, text: "我用输出压过他抢下整张图 然后他气得直接下线了"}
      - {speaker: B, text: "正义执行 被抢怪就该这么回应"}
      - {speaker: A, text: "结果他带了个朋友回来 俩人想前后包抄我"}
      - {speaker: B, text: "他们真为了一张僵尸蘑菇图组织了报复行动？", emote: 6}
      - {speaker: A, text: "千真万确 我后来直接换图了"}
      - {speaker: B, text: "有时候一张图真不值得折腾 哈哈"}

  old_friend_reunion:
    participants: 3
    lines:
      - {speaker: A, text: "等等 那是mikiryu吗 兄弟你跑哪去了"}
      - {speaker: B, text: "哇靠 咱俩得有快一年没见了吧"}
      - {speaker: A, text: "我还真以为你彻底退坑了"}
      - {speaker: B, text: "确实算退了 后来实在忍不住又回来了"}
      - {speaker: C, text: "等等 你们俩认识啊"}
      - {speaker: A, text: "我们以前经常一起打扎昆"}
      - {speaker: B, text: "那才叫痛快 还记得全队就剩咱俩活着那次吗"}
      - {speaker: A, text: "然后我们俩硬是把最后30%血磨死了 传奇一战", emote: 11}
      - {speaker: C, text: "可以 这故事真不错 我想听完整版"}
      - {speaker: B, text: "回头细讲 我很高兴我又回来了"}

  # ═══════════════════════════════════════
  #  ADDITIONAL CONVERSATIONS (BATCH 2)
  # ═══════════════════════════════════════

  hp_washing_debate:
    participants: 2
    lines:
      - {speaker: A, text: "你们会洗血吗"}
      - {speaker: B, text: "洗一点 很繁琐但打boss确实有用"}
      - {speaker: A, text: "但那些洗点卡值吗 挺贵的"}
      - {speaker: B, text: "看你对boss战有多认真 打扎昆的话基本是必需品"}
      - {speaker: A, text: "不知道 总觉得这枫币花得太无聊了", emote: 6}
      - {speaker: B, text: "是无聊 但至少打扎昆的时候不会被一击秒杀"}
      - {speaker: A, text: "也是 秒躺也很无聊"}

  trade_gone_wrong:
    participants: 2
    lines:
      - {speaker: A, text: "喂 你是要卖那个耳环对吧"}
      - {speaker: B, text: "对 1200万"}
      - {speaker: A, text: "行 交易我"}
      - {speaker: B, text: "等等 你放的是120万 不是1200万"}
      - {speaker: A, text: "哦哈哈看错了 我以为你说120万", emote: 7}
      - {speaker: B, text: "兄弟 这差了一个小数点啊", emote: 5}
      - {speaker: A, text: "我的错我的错 不过我也没1200万 祝你早点卖出去"}

  falling_asleep_at_keyboard:
    participants: 2
    lines:
      - {speaker: A, text: "嘿 你看到刚才那个怪掉的东西没"}
      - {speaker: A, text: "喂？"}
      - {speaker: A, text: "兄弟你就杵在地图正中间"}
      - {speaker: B, text: "啊 咋了 抱歉我趴键盘上睡着了", emote: 6}
      - {speaker: A, text: "笑死我就知道 你角色十分钟没动过了"}
      - {speaker: B, text: "我梦见自己还在刷怪 这算不算经验值"}
      - {speaker: A, text: "快去睡觉大哥"}

  pet_naming_stories:
    participants: 3
    lines:
      - {speaker: A, text: "你们的宠物都取的什么名"}
      - {speaker: B, text: "我的叫枫币 因为它捡的就只有这个"}
      - {speaker: C, text: "我按我家真猫的名字取的 叫面条", emote: 2}
      - {speaker: A, text: "面条好可爱 我的就叫狗"}
      - {speaker: B, text: "你给你家龙取名叫……狗？", emote: 6}
      - {speaker: A, text: "取名的时侯我慌了嘛"}
      - {speaker: C, text: "龙名狗 说实话挺有范儿的"}

  best_map_for_level_range:
    participants: 3
    lines:
      - {speaker: A, text: "咱们都是55-60级左右吧 去哪张图最好"}
      - {speaker: B, text: "肯定mp3 假人在我们这级经验给得离谱"}
      - {speaker: C, text: "不 幽灵船更好 没人抢 怪掉的东西也不错"}
      - {speaker: A, text: "那刺鱼呢 听说也不错"}
      - {speaker: B, text: "有自动捡宠就去刷刺鱼 不然还是mp3"}
      - {speaker: C, text: "幽灵船是真的被低估了 大家都无视它"}
      - {speaker: A, text: "行 那先试一小时幽灵船 不行就去mp3"}

  dark_scroll_gamble:
    participants: 2
    lines:
      - {speaker: A, text: "我这个披风该砸诅咒卷还是用60%"}
      - {speaker: B, text: "你有多爱这个披风"}
      - {speaker: A, text: "特别爱 花4000万买的"}
      - {speaker: B, text: "那千万别砸诅咒卷 失败一次就永远没了", emote: 5}
      - {speaker: A, text: "可万一成了那属性……"}
      - {speaker: B, text: "炸装备的人之前都是这么说的"}
      - {speaker: A, text: "行行行 用60% 我选择和平", emote: 7}

  mount_quest_struggle:
    participants: 2
    lines:
      - {speaker: A, text: "你做骑宠任务了吗"}
      - {speaker: B, text: "哪一步 收集怪物卡那段吗"}
      - {speaker: A, text: "对就是集卡 遥遥无期啊"}
      - {speaker: B, text: "我刷了大概3天才集齐"}
      - {speaker: A, text: "3天？？", emote: 5}
      - {speaker: B, text: "有些卡的爆率是真的离谱"}
      - {speaker: A, text: "折腾完这么多 希望它是全游戏最帅的坐骑"}

  random_defame_rage:
    participants: 2
    lines:
      - {speaker: A, text: "有个陌生人莫名其妙给我点了黑名", emote: 5}
      - {speaker: B, text: "哈 你惹他了？"}
      - {speaker: A, text: "没有！我就站在射手村 他走过来就给我点黑名"}
      - {speaker: B, text: "有些人就是见人就点黑名 算人家一种爱好吧"}
      - {speaker: A, text: "谁会一觉醒来专门去毁陌生人的名声啊"}
      - {speaker: B, text: "跟在10级图抢怪的是同一批人", emote: 3}
      - {speaker: A, text: "我把他们永久拉黑了"}

  comparing_ping:
    participants: 3
    lines:
      - {speaker: A, text: "我今天延迟200毫秒 这没法玩"}
      - {speaker: B, text: "200？？我才30"}
      - {speaker: C, text: "住在服务器旁边就是爽呗"}
      - {speaker: A, text: "我隔着一片大洋玩的 延迟永远都很烂"}
      - {speaker: B, text: "这延迟你怎么做跳跳任务啊", emote: 6}
      - {speaker: A, text: "做不了 跳跳任务我早就放弃了"}
      - {speaker: C, text: "带着延迟玩还挺敬业的 你这基本是困难模式"}

  ap_reset_advice:
    participants: 2
    lines:
      - {speaker: A, text: "我把能力点加错属性了 有办法补救吗"}
      - {speaker: B, text: "商城买洗点卷 不过要花点卷"}
      - {speaker: A, text: "自由市场里一般卖多少钱"}
      - {speaker: B, text: "看服务器行情 大概800到1500万一张"}
      - {speaker: A, text: "我一个法师加了5点力量 那得买5张洗点卷", emote: 4}
      - {speaker: B, text: "完了 这错误有点贵"}
      - {speaker: A, text: "记住了 以后点确定之前一定要再三检查"}

  if_i_were_a_gm:
    participants: 3
    lines:
      - {speaker: A, text: "如果你当GM 第一件事干什么"}
      - {speaker: B, text: "把自由市场里所有挂明显假价格的人全封了"}
      - {speaker: C, text: "我会把双倍经验永久化", emote: 3}
      - {speaker: A, text: "我嘛 说真的会给游戏加更多椅子"}
      - {speaker: B, text: "椅子？？这么多选择里挑椅子？？", emote: 6}
      - {speaker: A, text: "椅子才是真正的终极内容 我不想再装作不是了"}
      - {speaker: C, text: "行吧还真有点道理 我确实也收藏椅子"}

  kerning_pq_puzzle_memories:
    participants: 2
    lines:
      - {speaker: A, text: "你以前打过废都副本吗"}
      - {speaker: B, text: "当然 那时候没人知道绳子那关的正确组合 一关能磨半天"}
      - {speaker: A, text: "而且总有人站错台子"}
      - {speaker: B, text: "队长把组合打三遍 还是有人搞砸"}
      - {speaker: A, text: "但一旦来了一把丝滑通关 那感觉太棒了", emote: 2}
      - {speaker: B, text: "对 那个等级段副本奖励也确实值"}
      - {speaker: A, text: "最后的大王绿水灵永远是最燃的"}

  archer_underpowered_debate:
    participants: 3
    lines:
      - {speaker: A, text: "弓手其实很强 别再看不起他们了"}
      - {speaker: B, text: "强在哪 其他每个职业输出都比他们高", emote: 3}
      - {speaker: C, text: "四连箭单体伤害很扎实 而且射程有优势"}
