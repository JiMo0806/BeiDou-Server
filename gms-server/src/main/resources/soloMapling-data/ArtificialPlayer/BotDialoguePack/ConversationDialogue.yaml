      - {speaker: A, text: "好看比数值重要 我就要帅"}
      - {speaker: B, text: "这没毛病 搭配本来就是游戏的一部分"}
      - {speaker: A, text: "终于有人懂我了"}

  secret_shortcut_found:
    participants: 2
    lines:
      - {speaker: A, text: "等下 从魔法密林有传送口直接到玩具城？"}
      - {speaker: B, text: "有啊 没人用而已"}
      - {speaker: A, text: "所以我这几个月的船白坐了"}
      - {speaker: B, text: "欢迎体验冒险岛探索"}
