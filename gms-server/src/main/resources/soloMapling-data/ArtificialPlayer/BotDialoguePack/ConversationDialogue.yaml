      - {speaker: A, text: "那个……你要不要 哪天有空 一起赚点枫币什么的"}
      - {speaker: B, text: "……是约会的约会 还是游戏里一起玩的约会", emote: 6}
      - {speaker: A, text: "呃 你想要哪种就是哪种 哈哈"}
      - {speaker: B, text: "这是我这辈子读过最紧张的发言"}
      - {speaker: A, text: "我在这方面真不行嘛"}

  guildmate_crush_energy:
    participants: 3
    lines:
      - {speaker: A, text: "你们有没有觉得公会新来的那个敏捷弓手挺可爱的"}
      - {speaker: B, text: "哦豁 你心动了", emote: 3}
      - {speaker: A, text: "我没有！我就是客观评价一下"}
      - {speaker: C, text: "你这周把他们Facebook的帖子全点了一遍"}
      - {speaker: B, text: "藏不住了 哈哈"}

  virtual_couple_goals:
    participants: 2
    lines:
      - {speaker: A, text: "还记得我和前任以前天天一起刷boss吗"}
      - {speaker: B, text: "惨喽 现在只能单干了"}
      - {speaker: A, text: "最惨的分手 连练级搭子都没了"}
      - {speaker: B, text: "说不定人家还会回来呢 哈哈"}
      - {speaker: A, text: "也说不定我从此孤狼一辈子", emote: 4}

  awkward_compliment:
    participants: 2
    lines:
      - {speaker: A, text: "我以前见过你在这刷 挺强的"}
      - {speaker: B, text: "哦 谢谢？？", emote: 6}
      - {speaker: A, text: "我是说游戏里 你的技能循环很干净"}
      - {speaker: B, text: "哦哈哈哈哈我刚才还懵了一下", emote: 2}
      - {speaker: A, text: "是的 我这表述确实怪"}

  # CLASS / JOB BANTER

  thief_speed_flex:
    participants: 3
    lines:
      - {speaker: A, text: "飞侠真是全游戏最好玩的职业"}
      - {speaker: B, text: "好玩是好玩 输出也就中规中矩"}
      - {speaker: C, text: "不 装备成型的标飞伤害爆炸"}
      - {speaker: B, text: "但成型得砸5个亿进去"}
      - {speaker: A, text: "看 这就是飞侠人生 高风险高回报"}

  mage_aoe_superiority:
    participants: 2
    lines:
      - {speaker: A, text: "但法师的群攻就是无敌啊"}
      - {speaker: B, text: "所以才需要那么多投入才玩得起来"}
      - {speaker: A, text: "可一旦成型整张图就是他的了"}
      - {speaker: B, text: "也是 论纯群攻没有职业能比"}
      - {speaker: A, text: "法师值得更多尊重"}

  gunslinger_underrated:
    participants: 2
    lines:
      - {speaker: A, text: "为什么没人玩船长"}
      - {speaker: B, text: "兄弟我也不懂 明明很强就是没存在感"}
      - {speaker: A, text: "真的 功能性和伤害都有"}
      - {speaker: B, text: "大概是对海盗职业的偏见吧"}
      - {speaker: A, text: "海盗职业总有一天会崛起"}

  cleric_blessing_wars:
    participants: 2
    lines:
      - {speaker: A, text: "为什么主教打boss都先放花再放祝福"}
      - {speaker: B, text: "因为花更重要吧？"}
      - {speaker: A, text: "但花会掉 祝福能撑很久"}
      - {speaker: B, text: "行 有道理 下次我先放祝福"}
      - {speaker: A, text: "这真的能帮全队省钱 都传出去"}

  # SERVER / META OBSERVATIONS

  server_economy_collapse:
    participants: 3
    lines:
      - {speaker: A, text: "最近物价简直离谱到家了"}
      - {speaker: B, text: "工作室太多 供需已经崩了"}
      - {speaker: C, text: "经济完蛋了 直接回档重来吧"}
      - {speaker: A, text: "回档会天下大乱的"}
      - {speaker: B, text: "但也能重置这场疯狂"}

  population_shifted:
    participants: 2
    lines:
      - {speaker: A, text: "最近服务器感觉不一样了 人变少了"}
      - {speaker: B, text: "可能暑假结束了 孩子们开学了"}
      - {speaker: A, text: "不 这感觉更像是永久性的 好像有人在流失"}
      - {speaker: B, text: "再等等看 冒险岛的玩家数量 always 是有起有落的"}
      - {speaker: A, text: "希望你说得对"}

  patch_notes_confusion:
    participants: 2
    lines:
      - {speaker: A, text: "更新公告你看了吗"}
      - {speaker: B, text: "没有 改了什么好东西"}
      - {speaker: A, text: "我根本看不懂他们改了啥 哈哈"}
      - {speaker: B, text: "经典运营话术 说了一大堆等于啥也没说"}
      - {speaker: A, text: "所以本质上什么都没变"}

  new_player_waves:
    participants: 2
    lines:
      - {speaker: A, text: "最近看到好多新面孔"}
      - {speaker: B, text: "对 冒险岛最近好像又火了一波"}
      - {speaker: A, text: "他们能留下来吗 还是就试试水"}
      - {speaker: B, text: "能留1%就不错 剩下的三周内就退坑"}
      - {speaker: A, text: "冒险岛的生命循环"}

  # NOSTALGIA / VETERAN VIBES

  original_server_player:
    participants: 2
    lines:
      - {speaker: A, text: "我从beta就开始玩了 老冒险岛完全不一样"}
      - {speaker: B, text: "有多不一样"}
      - {speaker: A, text: "一切都更慢 更像是一个社区"}
      - {speaker: B, text: "对一个上古游戏来说 听着还挺美好的"}
      - {speaker: A, text: "确实 有些日子我还挺想念的"}

  class_balance_complainers:
    participants: 2
    lines:
      - {speaker: A, text: "还记得职业真正平衡的年代吗"}
      - {speaker: B, text: "那压根就没存在过 哈哈"}
      - {speaker: A, text: "行吧 但那时候感觉没现在这么崩"}
      - {speaker: B, text: "数值膨胀是真的 怀旧滤镜也是真的"}
      - {speaker: A, text: "也许吧 但老日子就是有那个味儿"}

  prebbq_grind_memories:
    participants: 3
    lines:
      - {speaker: A, text: "大变革前的练级是真的残酷"}
      - {speaker: B, text: "练到120真得用好几个月"}
      - {speaker: C, text: "现在认真玩几周就到了"}
      - {speaker: A, text: "但那时候升级是真有成就感"}
      - {speaker: B, text: "现在人人都满级 感觉毫无意义"}
      - {speaker: C, text: "那时候过程本身就是意义"}

  fm_culture_shift:
    participants: 2
    lines:
      - {speaker: A, text: "以前的自由市场多有人气 大家真的会聊天"}
      - {speaker: B, text: "现在就剩店铺和喇叭刷屏"}
      - {speaker: A, text: "还有挂机卖货的机器人"}
      - {speaker: B, text: "自由市场进化了 但灵魂没了"}
      - {speaker: A, text: "唉"}

  # HUMOR / CHAOS

  typo_in_broadcast:
    participants: 2
    lines:
      - {speaker: A, text: "你看到那条喇叭了吗 那哥们把整个商品清单都打错了"}
