      - {speaker: B, text: "回不去了 现在睡前玩个30分钟"}
      - {speaker: A, text: "至少肝这事迁就了我的日程"}

  new_skill_wow_moment:
    participants: 3
    lines:
      - {speaker: A, text: "刚解锁了个新技能 简直无敌"}
      - {speaker: B, text: "哪个技能"}
      - {speaker: A, text: "先不说 万一是隐藏套路呢 反正是真的猛"}
      - {speaker: C, text: "你这语气听着就很坏", emote: 3}
      - {speaker: A, text: "我要用这个横扫一切了"}

  community_event_hype:
    participants: 2
    lines:
      - {speaker: A, text: "你听说了吗 全服活动要来了"}
      - {speaker: B, text: "听说了 不过看着一般"}
      - {speaker: A, text: "这次奖励看着是真不错"}
      - {speaker: B, text: "行吧那我也参加"}
      - {speaker: A, text: "这就对了嘛"}

  scrolling_addiction:
    participants: 2
    lines:
      - {speaker: A, text: "我总是忍不住给没必要卷的东西卷卷轴"}
      - {speaker: B, text: "图啥"}
      - {speaker: A, text: "不知道 看数字往上涨就是爽 哪怕没意义"}
      - {speaker: B, text: "这还真挺有共鸣的 多巴胺到了"}
      - {speaker: A, text: "我对数字上涨已经上瘾了"}

  endgame_goal_setting:
    participants: 2
    lines:
      - {speaker: A, text: "毕业期了你现在在冲什么目标"}
      - {speaker: B, text: "说实话就随便玩玩 跟朋友打打boss"}
      - {speaker: A, text: "不是 我说大目标"}
      - {speaker: B, text: "我早就过了有目标的阶段 现在只是存在"}
      - {speaker: A, text: "听着其实还挺平和的"}

  map_ownership_territory:
    participants: 3
    lines:
      - {speaker: A, text: "如果有人在你最爱的图练级 你们会换图吗"}
      - {speaker: B, text: "我一般会问能不能一起刷"}
      - {speaker: C, text: "看人 有的人随和有的人毒"}
      - {speaker: A, text: "地图真是种奇怪的社交契约"}
      - {speaker: B, text: "就像看不见的领地"}
      - {speaker: C, text: "冒险岛文化就是这么怪 哈哈"}
