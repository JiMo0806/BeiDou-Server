      - {speaker: A, text: "等下啥 这怎么可能"}
      - {speaker: C, text: "太多法师同时放太多buff 哈哈哈"}
      - {speaker: B, text: "buff叠罗汉可能是冒险岛里最混乱的场面了", emote: 2}

  passive_income_hustle:
