      - "最烂的操作是慌乱叫牌。永远别慌着叫牌。"
      - "好牌会打砸。烂牌偶尔能打活。这就是冒险岛21点。"
      - "爆牌还能一笑了之的玩家是我最喜欢的类型。"
      - {line: "如果早料到了，每次爆牌都少疼一点。", emote: [4, 0]}
      - "17点停牌。有人有意见，但我不改口。"
      - "21点最爽的瞬间是牌翻开前的那一刻。"
