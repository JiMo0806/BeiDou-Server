TutorialBot:
  Greeting:
    text:
      - "嘿 %RESP_NAME%！欢迎来到 SoloMapling！"
    emote: 2
    wait: 1
  Inquiry:
    text:
      - "你是第一次来这个服吗？"
    emote: 6
    wait: 1
  AskAdmin:
    text:
      - "在带你转一圈之前……"
      - "这个服还在测试阶段，我们在招管理员帮忙。"
      - "你想当服务器管理员吗？可以拿到完整的 GM 权限和一些新手装备。"
