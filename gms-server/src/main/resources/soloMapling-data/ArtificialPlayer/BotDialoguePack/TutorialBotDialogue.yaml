    wait: 2
  GiftTradeIntro:
    text:
      - "接受我的交易请求，我给你金币、药水和飞镖。"
    emote: 2
    wait: 1
  Tutorial_1:
    text:
      - "想跟其他玩家说话，要打出对方的完整名字"
      - "比如你想跟我说话，就输入 %CHR_NAME%"
      - "记住，必须和玩家名字一字不差！"
    emote: 3
    wait: 1
  Tutorial_2:
    text:
      - "接下来，其他玩家可能会让你做选择。"
      - "想回应的话，直接打出你想选的那个选项就行（不区分大小写）"
      - "来试试吧。你想留下哪顶帽子？"
    emote: 1
    wait: 1
  AnalyzePlayersWeapon:
    text:
      - "你手里那把 %WPN_NAME%……"
      - "把它扔到地上，我帮你看看。"
    emote: 3
    wait: 1
