name: Build BeiDou-Bot Server

on:
  push:
    branches: [main, master, bot-port]
    tags: ['v*']
  pull_request:
    branches: [main, master, bot-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build server jar
        run: mvn -B -ntp -pl gms-server -am package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeiDou-jar
          path: gms-server/target/BeiDou.jar
          retention-days: 30

  release:
    # Tag pushes (e.g. v1.11-bot.1) publish the jar as a GitHub Release,
    # which the NAS deployment can download directly.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: BeiDou-jar

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: BeiDou.jar
          generate_release_notes: true
